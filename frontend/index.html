<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%231F3A5F%22%20stroke-width%3D%221.5%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%228.5%22%2F%3E%3Cpath%20d%3D%22M14.6%209.4l-2.3%204.1-4.1%202.3%202.3-4.1%204.1-2.3z%22%20fill%3D%22%231F3A5F%22%20stroke%3D%22none%22%2F%3E%3C%2Fsvg%3E"/>
<title>Profit Compass</title>
<!--
  DESIGN PLAN — "drafting sheet" system for Q's Advertising
  ---------------------------------------------------------------------------
  Read: a working instrument for a Finance & Ops lead, used daily. Utilitarian,
  dense, information-design-first. Q's Advertising fabricates physical objects —
  timber frames, LED modules, fabric backdrops, site rigs — so the interface
  borrows the vocabulary of shop drawings rather than of dashboards.

  COLOR (light)
    #FBFAF8  paper ground (a drafting sheet, not a cream craft-paper look)
    #16171A  ink / #5A5E66 secondary ink / #8B8F98 faint
    #DEDBD4  hairline rule / #BFBBB2 strong rule
    #1F3A5F  drafting-pen blue — the single interactive accent, kept clear of semantics
    #0F7B5A / #A96B12 / #A33124  semantic good / watch / critical, ink-like not candy
    categorical ramp #1F3A5F #8C5A32 #3F6B63 #6E7C93 #9A958B — desaturated and
    ordered so a category's colour can never be misread as a health signal
  Dark theme mirrors the same roles on a #141619 ground.

  TYPE
    Archivo      — display: KPI numerals, headings. An industrial grotesk, apt
                   for a company that fabricates signage.
    IBM Plex Sans— UI, body, tables. Engineering pedigree, metrically matched to:
    IBM Plex Mono— annotation: IDs, dates, formulas, labels, the title block.
                   Mono is the drawing-annotation voice throughout.

  LAYOUT
    Rail (binding edge) | canvas (the sheet) | AI panel — all one paper world,
    separated by hairline rules rather than by a dark chrome slab. A persistent
    TITLE BLOCK sits under the topbar: project no. / client / stage / data-as-of /
    revision / sheet. It is the hallmark, and it is functional — provenance is
    exactly what this product sells.

  WHERE THE CRAFT LIVES (only where it carries information)
    · Variance is drawn as a DIMENSION LINE with tick caps, measured against a
      dashed budget station mark — the way this company measures things.
    · Budget / actual / forecast are distinguished by LINE CONVENTION
      (hairline+caps / solid / dashed), not by three competing hues.
    · KPI numerals carry a mono leader tick pointing back at their source field.
    · Lifecycle is a schedule line with diamond station ticks.
    · AI narration is set apart by a mono margin label, a rule and a narrow
      measure — not by a typeface swap or a coloured box.

  DATA TRACEABILITY
  Every figure rendered on screen is read from the DATA object below, which mirrors
  the schema in QA_Mock_UI_Spec.md §1 (Project, CostTransaction, LabourEntry,
  RiskAlert, ProfitabilitySnapshot, QuoteRequest, ChatTurn) and is populated only
  from §2's instances. Where a figure is derived (forecast allocation, quote
  contract value), the formula is computed live in JS and shown next to the result.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  /* ============================================================
     TOKENS — "drafting sheet" system.
     Q's Advertising fabricates physical things: timber frames, LED
     modules, fabric backdrops, site rigs. Their working documents are
     shop drawings, cut lists and phase schedules — so the interface
     borrows that vocabulary (hairline rules, title block, mono
     annotation, dimension lines) rather than dashboard vocabulary.
     ============================================================ */
  :root{
    /* paper & ink */
    --bg:#FBFAF8; --surface:#FFFFFF; --surface-2:#F4F2ED; --surface-3:#E9E6DF;
    --border:#DEDBD4; --border-strong:#BFBBB2;
    --text:#16171A; --text-muted:#5A5E66; --text-faint:#8B8F98;

    /* drafting-pen blue: the one interactive accent, kept clear of semantics */
    --brand:#1F3A5F; --brand-ink:#132840; --brand-bg:#E9EEF4;

    /* semantic — ink-like, never candy */
    --good:#0F7B5A; --good-bg:#E5EFE9; --good-ink:#0B5C43;
    --warn:#A96B12; --warn-bg:#F7EFE0; --warn-ink:#7E500D;
    --critical:#A33124; --critical-bg:#F6E8E5; --critical-ink:#7D2519;

    /* categorical — an ordered, desaturated ramp so no bar's colour
       can be misread as a health signal; over/under is stated in text */
    --cat-material:#1F3A5F; --cat-labour:#8C5A32; --cat-subcontractor:#3F6B63;
    --cat-logistics:#6E7C93; --cat-other:#9A958B;

    /* the nav rail and AI panel now belong to the same paper world as the
       canvas (token names kept stable so component styles read consistently) */
    --chrome-bg:#F4F2ED; --chrome-bg-2:#E9E6DF; --chrome-text:#16171A;
    --chrome-muted:#5A5E66; --chrome-border:#DEDBD4; --chrome-active:#E9EEF4;

    --elev: 0 2px 4px rgba(22,23,26,.05), 0 18px 34px -18px rgba(22,23,26,.24);
    --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--brand);
    --r:3px;
    --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --font-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141619; --surface:#1B1E22; --surface-2:#22262B; --surface-3:#2C3138;
      --border:#333840; --border-strong:#4A505A;
      --text:#E9E7E2; --text-muted:#A0A4AC; --text-faint:#787D86;
      --brand:#7FA8D4; --brand-ink:#A8C6E4; --brand-bg:#1D2A38;
      --good:#4FB891; --good-bg:#16261F; --good-ink:#6FCBA7;
      --warn:#D3A05A; --warn-bg:#2A2116; --warn-ink:#E0B478;
      --critical:#D9705C; --critical-bg:#2C1B18; --critical-ink:#E58D7A;
      --cat-material:#7FA8D4; --cat-labour:#C68E5F; --cat-subcontractor:#6FA095;
      --cat-logistics:#98A4B8; --cat-other:#A8A296;
      --chrome-bg:#1B1E22; --chrome-bg-2:#2C3138; --chrome-text:#E9E7E2;
      --chrome-muted:#A0A4AC; --chrome-border:#333840; --chrome-active:#1D2A38;
      --elev: 0 2px 4px rgba(0,0,0,.34), 0 18px 36px -16px rgba(0,0,0,.62);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141619; --surface:#1B1E22; --surface-2:#22262B; --surface-3:#2C3138;
    --border:#333840; --border-strong:#4A505A;
    --text:#E9E7E2; --text-muted:#A0A4AC; --text-faint:#787D86;
    --brand:#7FA8D4; --brand-ink:#A8C6E4; --brand-bg:#1D2A38;
    --good:#4FB891; --good-bg:#16261F; --good-ink:#6FCBA7;
    --warn:#D3A05A; --warn-bg:#2A2116; --warn-ink:#E0B478;
    --critical:#D9705C; --critical-bg:#2C1B18; --critical-ink:#E58D7A;
    --cat-material:#7FA8D4; --cat-labour:#C68E5F; --cat-subcontractor:#6FA095;
    --cat-logistics:#98A4B8; --cat-other:#A8A296;
    --chrome-bg:#1B1E22; --chrome-bg-2:#2C3138; --chrome-text:#E9E7E2;
    --chrome-muted:#A0A4AC; --chrome-border:#333840; --chrome-active:#1D2A38;
    --elev: 0 2px 4px rgba(0,0,0,.34), 0 18px 36px -16px rgba(0,0,0,.62);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  /* the shell owns the viewport; only .canvas and .dd-body scroll. Without this,
     a scrollIntoView() inside the canvas can drag the whole chrome off-screen. */
  html,body{ height:100%; overflow:hidden; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-ui); font-size:13.5px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4,.display,.serif{ font-family:var(--font-display); letter-spacing:-.005em; }
  .num,table,.mono{ font-variant-numeric:tabular-nums; }
  .mono{ font-family:var(--font-mono); }
  button,input,select,textarea{ font-family:inherit; }
  a{ color:var(--brand); }
  ::selection{ background:var(--brand); color:var(--surface); }
  :focus-visible{ outline:none; box-shadow:var(--focus); border-radius:2px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001ms !important; transition-duration:.001ms !important; } }

  /* ---------- app shell ---------- */
  .app{ height:100vh; height:100dvh; display:grid; grid-template-columns:56px 1fr minmax(272px,318px); min-width:960px; overflow:hidden; }
  @media (max-width:1020px){
    .app{ grid-template-columns:56px 1fr; }
    .ai-panel{ display:none; }
    .ai-panel.open{ display:flex; position:fixed; right:0; top:0; bottom:0; width:min(318px,92vw); z-index:60; box-shadow:var(--elev); }
  }

  /* rail — the binding edge of the drawing set */
  .rail{ background:var(--chrome-bg); color:var(--chrome-text); display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:2px; border-right:1px solid var(--chrome-border); }
  .rail .brand-mark{ width:30px; height:30px; border-radius:2px; border:1px solid var(--brand); color:var(--brand); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .rail-btn{ width:38px; height:38px; border-radius:2px; border:none; background:transparent; color:var(--chrome-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; transition:background .12s,color .12s; }
  .rail-btn svg{ width:18px; height:18px; }
  .rail-btn:hover{ background:var(--chrome-bg-2); color:var(--chrome-text); }
  .rail-btn.active{ background:var(--chrome-active); color:var(--brand); }
  .rail-btn.active::before{ content:""; position:absolute; left:-12px; top:6px; bottom:6px; width:2px; background:var(--brand); }
  .rail-btn .tip{ position:absolute; left:48px; top:50%; transform:translateY(-50%); background:var(--text); color:var(--bg); font-family:var(--font-mono); font-size:10.5px; letter-spacing:.03em; padding:5px 8px; border-radius:2px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; z-index:80; }
  .rail-btn:hover .tip{ opacity:1; }
  .rail-spacer{ flex:1; }

  /* ---------- main canvas ---------- */
  .main{ display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg); position:relative; }
  .topbar{ display:flex; align-items:center; gap:14px; padding:12px 22px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .topbar h1{ font-size:17px; font-weight:600; margin:0; }
  .crumbs{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; text-transform:uppercase; color:var(--text-faint); padding-left:12px; border-left:1px solid var(--border); }
  .topbar .spacer{ flex:1; }
  .proj-switch{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:5px 10px; }
  .proj-switch > span{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
  .proj-switch select{ border:none; background:transparent; color:var(--text); font-size:12.5px; font-weight:600; cursor:pointer; max-width:210px; }
  .icon-btn{ width:32px; height:32px; border-radius:var(--r); border:1px solid var(--border); background:var(--surface); color:var(--text-muted); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .icon-btn:hover{ color:var(--text); background:var(--surface-2); }
  .icon-btn svg{ width:16px; height:16px; }

  /* ---------- TITLE BLOCK — the hallmark.
     Every drawing sheet carries one; here it doubles as provenance,
     which is exactly what this product sells. ---------- */
  .titleblock{ display:flex; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; overflow-x:auto; }
  .tb-cell{ padding:7px 16px; border-right:1px solid var(--border); display:flex; flex-direction:column; gap:2px; min-width:0; flex-shrink:0; }
  .tb-cell:last-child{ border-right:none; }
  .tb-cell.tb-grow{ flex:1; min-width:120px; }
  .tb-k{ font-family:var(--font-mono); font-size:9px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint); }
  .tb-v{ font-family:var(--font-mono); font-size:11.5px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums; }
  .tb-v.ok{ color:var(--good); }

  .canvas{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:20px 22px 44px; scroll-behavior:smooth; }

  /* ---------- primitives ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); }
  .pad{ padding:16px 18px; }
  .grid{ display:grid; gap:14px; }
  .muted{ color:var(--text-muted); }
  .hr{ height:1px; background:var(--border); border:none; margin:13px 0; }

  /* a section label draws its own rule across the sheet */
  .section-label{ font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); display:flex; align-items:center; gap:10px; margin:0 0 12px; }
  .section-label::after{ content:""; flex:1; height:1px; background:var(--border); }

  /* status tag — square, ruled, mono. Not a pill. */
  .pill{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:3px 7px; border-radius:2px; border:1px solid currentColor; white-space:nowrap; }
  .pill.good{ color:var(--good-ink); background:var(--good-bg); }
  .pill.warn{ color:var(--warn-ink); background:var(--warn-bg); }
  .pill.critical{ color:var(--critical-ink); background:var(--critical-bg); }
  .pill.neutral{ color:var(--text-muted); background:var(--surface-2); border-color:var(--border-strong); }
  .pill.brand{ color:var(--brand-ink); background:var(--brand-bg); border-color:var(--brand); }
  .dot{ width:5px; height:5px; background:currentColor; flex-shrink:0; }

  .btn{ border:1px solid transparent; border-radius:var(--r); padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:7px; transition:background .12s,border-color .12s; }
  .btn svg{ width:14px; height:14px; }
  .btn.primary{ background:var(--brand); color:var(--surface); border-color:var(--brand); }
  .btn.primary:hover{ background:var(--brand-ink); border-color:var(--brand-ink); }
  .btn.ghost{ background:var(--surface); color:var(--text); border-color:var(--border); }
  .btn.ghost:hover{ background:var(--surface-2); border-color:var(--border-strong); }
  .btn.sm{ padding:5px 10px; font-size:11.5px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .icon-circle{ display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .icon-circle svg{ width:100%; height:100%; }

  /* ---------- KPI strip: one ruled instrument panel, not five floating cards ---------- */
  .kpi-strip{ display:grid; grid-template-columns:repeat(5,1fr); gap:0; border:1px solid var(--border); border-radius:var(--r); background:var(--surface); overflow:hidden; }
  .kpi{ border:none; border-left:1px solid var(--border); border-radius:0; background:transparent; padding:13px 16px 14px; }
  .kpi:first-child{ border-left:none; }
  .kpi .lbl{ font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint); margin-bottom:9px; }
  .kpi .val{ font-family:var(--font-display); font-size:27px; font-weight:600; line-height:1; letter-spacing:-.02em; }
  /* a leader tick, the way a dimension callout points back at what it measures */
  .kpi .sub{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.02em; color:var(--text-faint); margin-top:9px; display:flex; align-items:center; gap:6px; }
  .kpi .sub::before{ content:""; width:9px; height:1px; background:var(--border-strong); flex-shrink:0; }
  .kpi.tone-good .val{ color:var(--good); }
  .kpi.tone-critical .val{ color:var(--critical); }

  /* ---------- portfolio ---------- */
  .proj-grid{ grid-template-columns:repeat(auto-fill,minmax(268px,1fr)); }
  .proj-card{ padding:0; cursor:pointer; display:flex; flex-direction:column; transition:border-color .12s,background .12s; overflow:hidden; }
  .proj-card:hover{ border-color:var(--brand); background:var(--surface-2); }
  .proj-card .pc-no{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.12em; color:var(--text-faint); padding:7px 15px; border-bottom:1px solid var(--border); background:var(--surface-2); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .proj-card:hover .pc-no{ background:var(--surface-3); }
  .proj-card .pc-body{ padding:13px 15px 14px; display:flex; flex-direction:column; gap:11px; flex:1; }
  .proj-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .proj-card h3{ font-size:15px; font-weight:600; margin:0 0 3px; line-height:1.3; }
  .proj-card .cust{ font-size:12px; color:var(--text-muted); }
  .proj-card .metrics{ display:flex; justify-content:space-between; align-items:flex-end; padding-top:11px; border-top:1px solid var(--border); }
  .proj-card .metric .m-lbl{ font-family:var(--font-mono); font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.11em; margin-bottom:3px; }
  .proj-card .metric .m-val{ font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:-.015em; }
  .newquote-card{ border:1px dashed var(--border-strong); background:transparent; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:7px; padding:18px; cursor:pointer; color:var(--text-muted); min-height:130px; border-radius:var(--r); }
  .newquote-card:hover{ border-color:var(--brand); color:var(--brand); background:var(--brand-bg); }

  /* ---------- DIMENSION LINES — variance drawn the way this company measures ---------- */
  .barlist{ display:flex; flex-direction:column; gap:3px; }
  .barrow{ display:grid; grid-template-columns:132px 1fr 132px; align-items:center; gap:12px; font-size:12.5px; padding:5px 6px; border-radius:2px; }
  .barrow.clickable{ cursor:pointer; }
  .barrow.clickable:hover{ background:var(--surface-2); }
  .barrow .cat-lbl{ display:flex; align-items:center; gap:8px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cat-tick{ width:3px; height:13px; flex-shrink:0; border-radius:1px; }
  .barrow .amt{ text-align:right; font-family:var(--font-mono); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .barrow .amt .delta{ color:var(--text-faint); }

  /* the measurement itself: a rule with tick caps, over a faint full-scale reference.
     The station label is kept inside the track's own height so it can never
     collide with the row above. */
  .track{ position:relative; height:26px; }
  .track::before{ content:""; position:absolute; left:0; right:0; top:16px; height:1px; background:var(--border); }
  .track > .dim{ position:absolute; left:0; top:16px; height:1px; }
  .track > .dim::before, .track > .dim::after{ content:""; position:absolute; top:-5px; width:1px; height:11px; background:inherit; }
  .track > .dim::before{ left:0; }
  .track > .dim::after{ right:0; }
  /* budget reference mark — a dashed station line the actual is measured against */
  .track > .ref{ position:absolute; top:10px; bottom:2px; width:1px; background:repeating-linear-gradient(to bottom,var(--text-faint) 0 2px,transparent 2px 4px); }
  .track > .ref::after{ content:attr(data-lbl); position:absolute; top:-11px; left:50%; transform:translateX(-50%); font-family:var(--font-mono); font-size:8px; letter-spacing:.08em; color:var(--text-faint); white-space:nowrap; }

  /* budget / actual / forecast — differentiated by line convention, not by three hues */
  .grouped-row{ display:grid; grid-template-columns:126px 1fr; gap:12px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); }
  .grouped-row:last-of-type{ border-bottom:none; }
  .grouped-bars{ display:flex; flex-direction:column; gap:6px; }
  .grouped-bars .gb{ display:flex; align-items:center; gap:10px; }
  .grouped-bars .gb .gk{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); width:52px; flex-shrink:0; }
  .grouped-bars .gb .gtrack{ flex:1; position:relative; height:11px; }
  .grouped-bars .gb .gtrack::before{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--border); }
  .grouped-bars .gb .gtrack > span{ position:absolute; left:0; top:50%; transform:translateY(-50%); }
  .gb.budget .gtrack > span{ height:1px; background:var(--text-faint); }
  .gb.budget .gtrack > span::before,.gb.budget .gtrack > span::after{ content:""; position:absolute; top:-4px; width:1px; height:9px; background:var(--text-faint); }
  .gb.budget .gtrack > span::before{ left:0; } .gb.budget .gtrack > span::after{ right:0; }
  .gb.actual .gtrack > span{ height:7px; border-radius:1px; }
  .gb.forecast .gtrack > span{ height:0; border-top:1px dashed var(--brand); }
  .gb.forecast .gtrack > span::after{ content:""; position:absolute; right:0; top:-4px; width:1px; height:9px; background:var(--brand); }
  .grouped-bars .gb .gval{ width:74px; text-align:right; font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .legend{ display:flex; gap:18px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); margin-top:12px; padding-top:10px; border-top:1px solid var(--border); flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:16px; height:0; display:inline-block; border-top:1px solid currentColor; }
  .legend i.solid{ height:6px; border-top:none; border-radius:1px; }
  .legend i.dash{ border-top-style:dashed; }

  /* ---------- lifecycle: a construction schedule line with station ticks ---------- */
  .lifecycle{ display:flex; align-items:flex-start; position:relative; padding-top:14px; }
  .lc-step{ flex:1; display:flex; flex-direction:column; align-items:center; gap:9px; position:relative; }
  .lc-step .lc-node{ width:9px; height:9px; background:var(--surface); border:1px solid var(--border-strong); z-index:1; transform:rotate(45deg); }
  .lc-step.filled .lc-node{ background:var(--brand); border-color:var(--brand); }
  .lc-step.current .lc-node{ width:13px; height:13px; background:var(--surface); border:2px solid var(--brand); }
  .lc-step .lc-line{ position:absolute; top:4px; left:-50%; width:100%; height:1px; background:var(--border); z-index:0; }
  .lc-step.filled .lc-line{ background:var(--brand); }
  .lc-step:first-child .lc-line{ display:none; }
  .lc-step span.lc-name{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); text-align:center; }
  .lc-step.current span.lc-name{ color:var(--brand); font-weight:600; }

  /* ---------- AI layer.
     Distinguished by a mono margin label, a rule and a narrower measure —
     not by a different typeface or a coloured box. ---------- */
  .ai-mark{ width:17px; height:17px; border:1px solid var(--brand); border-radius:2px; color:var(--brand); background:transparent; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ai-mark svg{ width:10px; height:10px; }
  .sources-line{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:0 0 14px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .source-chip{ display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:2px; padding:3px 8px; color:var(--text-muted); text-transform:none; letter-spacing:.02em; font-size:10px; }
  .source-chip .sc-dot{ width:5px; height:5px; }
  .source-chip.b1 .sc-dot{ background:var(--brand); }
  .source-chip.ta .sc-dot{ background:var(--cat-labour); }

  .insight-grid{ display:flex; flex-direction:column; gap:8px; margin-bottom:20px; }
  .insight-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r); overflow:hidden; opacity:0; transform:translateY(4px); animation:insightIn .3s ease forwards; }
  .insight-card:hover{ border-color:var(--border-strong); }
  @keyframes insightIn{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .insight-card{ animation:none; opacity:1; transform:none; } }
  .insight-head{ display:flex; align-items:flex-start; gap:13px; padding:14px 16px; cursor:pointer; }
  /* a short category tick, deliberately NOT a full-height accent stripe */
  .insight-head .ih-tick{ width:3px; height:12px; margin-top:2px; flex-shrink:0; border-radius:1px; }
  .insight-head .ih-body{ flex:1; min-width:0; }
  .insight-head .ih-cat{ font-family:var(--font-mono); font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.12em; color:var(--text-faint); margin-bottom:5px; }
  .insight-head .ih-text{ font-size:14px; line-height:1.55; color:var(--text); max-width:64ch; }
  .insight-head .ih-text b{ font-weight:600; }
  /* the impact reads as a boxed callout, and carries the tone — no accent stripe */
  .insight-head .ih-impact{ text-align:right; flex-shrink:0; border:1px solid var(--border); border-radius:2px; padding:6px 10px; align-self:flex-start; min-width:112px; }
  .insight-card.tone-negative .ih-impact{ border-color:var(--critical); }
  .insight-card.tone-watch .ih-impact{ border-color:var(--warn); }
  .insight-card.tone-positive .ih-impact{ border-color:var(--good); }
  .insight-head .ih-impact .amt{ font-family:var(--font-display); font-size:15.5px; font-weight:600; letter-spacing:-.015em; }
  .insight-head .ih-impact.neg .amt{ color:var(--critical); }
  .insight-head .ih-impact.pos .amt{ color:var(--good); }
  .insight-head .ih-impact .sub{ font-family:var(--font-mono); font-size:8.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em; margin-top:3px; }
  .insight-head .ih-chev{ color:var(--text-faint); transition:transform .15s; align-self:center; flex-shrink:0; display:flex; }
  .insight-head .ih-chev svg{ width:13px; height:13px; }
  .insight-card.open .ih-chev{ transform:rotate(90deg); }
  .insight-detail{ max-height:0; overflow:hidden; transition:max-height .22s ease; }
  .insight-card.open .insight-detail{ max-height:1100px; }
  .insight-detail-inner{ padding:14px 16px 16px 32px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:14px; }

  .synth-block .synth-lbl{ display:flex; align-items:center; gap:7px; font-family:var(--font-mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.14em; margin-bottom:8px; }
  .synth-computed{ background:var(--surface-2); border:1px solid var(--border); border-radius:2px; padding:11px 13px; }
  .synth-computed .synth-lbl{ color:var(--text-faint); }
  .synth-computed code{ font-family:var(--font-mono); font-size:11.5px; color:var(--text); font-variant-numeric:tabular-nums; line-height:1.6; }
  /* narration: a margin rule and a narrow measure carry the register change */
  .synth-narration{ border-left:1px solid var(--border-strong); padding:1px 0 1px 14px; }
  .synth-narration .synth-lbl{ color:var(--brand); }
  .synth-narration p{ margin:0; font-size:13.5px; line-height:1.65; color:var(--text); max-width:62ch; }
  .trace-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .trace-chip{ display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:2px; padding:6px 10px; font-size:11.5px; cursor:pointer; text-align:left; color:var(--text); }
  .trace-chip:hover{ border-color:var(--brand); background:var(--brand-bg); }
  .trace-chip .tc-id{ font-family:var(--font-mono); font-weight:600; font-size:11px; }
  .trace-chip .tc-amt{ color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .insight-actions{ display:flex; gap:8px; flex-wrap:wrap; }

  /* ---------- Labour Journal (Time & Attendance) ---------- */
  .journal-panel{ background:var(--surface-2); border:1px solid var(--border); border-radius:2px; padding:13px 14px; }
  .journal-head{ display:flex; align-items:center; gap:9px; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; margin-bottom:13px; }
  .journal-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-bottom:14px; background:var(--border); border:1px solid var(--border); border-radius:2px; overflow:hidden; }
  .journal-stats > div{ background:var(--surface); padding:9px 11px; }
  .journal-stats .js-lbl{ font-family:var(--font-mono); font-size:8.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em; margin-bottom:3px; }
  .journal-stats .js-val{ font-family:var(--font-display); font-size:16px; font-weight:600; letter-spacing:-.015em; }
  .ot-phase-row{ display:grid; grid-template-columns:88px 1fr 58px; gap:10px; align-items:center; font-family:var(--font-mono); font-size:10px; letter-spacing:.04em; margin-bottom:6px; color:var(--text-muted); }
  .ot-phase-row .optrack{ position:relative; height:9px; }
  .ot-phase-row .optrack::before{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--border); }
  .ot-phase-row .optrack > span{ position:absolute; left:0; top:50%; transform:translateY(-50%); height:5px; background:var(--cat-labour); border-radius:1px; }

  /* ---------- transaction table ---------- */
  .txn-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .txn-table th{ text-align:left; font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-faint); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--border-strong); position:sticky; top:0; background:var(--surface); z-index:2; }
  .txn-table td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .txn-table td:first-child,.txn-table td:nth-child(2){ font-family:var(--font-mono); font-size:11px; color:var(--text-muted); }
  .txn-table tr:hover td{ background:var(--surface-2); }
  .txn-table tr.flagged td{ background:var(--critical-bg); }
  .txn-table tr.flagged td:first-child{ box-shadow:inset 2px 0 0 var(--critical); }
  .txn-table tr.flagged:hover td{ background:var(--critical-bg); }
  .txn-table tr.trace-highlight td{ background:var(--brand-bg); }
  .txn-table tr.trace-highlight td:first-child{ box-shadow:inset 2px 0 0 var(--brand); }
  .tag-badge{ font-family:var(--font-mono); font-size:9px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:3px 6px; border-radius:2px; display:inline-flex; align-items:center; gap:4px; border:1px solid currentColor; white-space:nowrap; }
  .tag-badge.tagged{ color:var(--text-muted); background:var(--surface-2); border-color:var(--border-strong); }
  .tag-badge.inherited{ color:var(--brand-ink); background:var(--brand-bg); border-color:var(--brand); }
  .tag-badge.suggested{ color:var(--warn-ink); background:var(--warn-bg); }
  .tag-badge.unallocated{ color:var(--critical-ink); background:var(--critical-bg); }
  .txn-table th.sortable{ cursor:pointer; user-select:none; }
  .txn-table th.sortable:hover{ color:var(--text); }
  .txn-table th.sortable .sort-arrow{ margin-left:4px; font-size:9px; opacity:.4; }
  .txn-table th.sortable.sort-active{ color:var(--brand); }
  .txn-table th.sortable.sort-active .sort-arrow{ opacity:1; }

  /* ---------- drill-down slide-over ---------- */
  .drilldown-scrim{ position:fixed; inset:0; background:rgba(16,17,20,.32); z-index:40; opacity:0; pointer-events:none; transition:opacity .18s; }
  .drilldown-scrim.open{ opacity:1; pointer-events:auto; }
  .drilldown{ position:fixed; top:0; bottom:0; right:318px; width:min(860px,76vw); background:var(--surface); border-left:1px solid var(--border-strong); box-shadow:var(--elev); transform:translateX(calc(100% + 400px)); transition:transform .2s ease; z-index:50; display:flex; flex-direction:column; pointer-events:none; }
  .drilldown.open{ transform:translateX(0); pointer-events:auto; }
  @media (max-width:1020px){ .drilldown{ right:0; width:min(860px,92vw); } }
  /* wide table scrolls inside its own container — the panel never scrolls sideways */
  .txn-scroll{ overflow-x:auto; margin:0 -18px; padding:0 18px; }
  .dd-head{ padding:13px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; background:var(--surface-2); }
  .dd-head .crumb{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .dd-head .crumb b{ color:var(--text); font-weight:600; }
  .dd-body{ flex:1; min-height:0; overflow-y:auto; padding:16px 18px 32px; }
  .dd-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .toggle{ display:inline-flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); cursor:pointer; user-select:none; }
  .toggle .box{ width:15px; height:15px; border-radius:2px; border:1px solid var(--border-strong); display:flex; align-items:center; justify-content:center; }
  .toggle.checked .box{ background:var(--brand); border-color:var(--brand); }
  .toggle.checked .box svg{ width:10px; height:10px; stroke:var(--surface); }
  .callout{ border-radius:2px; padding:11px 13px; font-size:12.2px; line-height:1.55; display:flex; gap:10px; align-items:flex-start; border:1px solid var(--border); background:var(--surface-2); color:var(--text-muted); }
  .callout b{ color:var(--text); font-weight:600; }
  .callout svg{ width:15px; height:15px; flex-shrink:0; margin-top:2px; color:var(--text-faint); }
  .callout.info{ border-left:2px solid var(--brand); }
  .callout.info svg{ color:var(--brand); }
  .callout.warn{ border-left:2px solid var(--warn); background:var(--warn-bg); color:var(--warn-ink); }
  .callout.warn svg{ color:var(--warn); }

  /* ---------- AI panel ---------- */
  .ai-panel{ background:var(--chrome-bg); color:var(--chrome-text); display:flex; flex-direction:column; min-height:0; border-left:1px solid var(--chrome-border); }
  .ai-head{ padding:12px 15px 12px; border-bottom:1px solid var(--chrome-border); }
  .ai-scope{ margin-bottom:0 !important; font-family:var(--font-mono); font-size:9px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.13em; font-weight:600; margin-bottom:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ai-head-row{ display:flex; align-items:center; gap:10px; margin-bottom:7px; }
  .ai-name{ display:flex; align-items:center; gap:8px; flex:1; font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--text); }
  .ai-name-mark{ width:19px; height:19px; border:1px solid var(--brand); border-radius:2px; color:var(--brand); display:inline-flex; align-items:center; justify-content:center; }
  .ai-name-mark svg{ width:11px; height:11px; }
  .icon-btn.sm{ width:26px; height:26px; }
  .icon-btn.sm svg{ width:13px; height:13px; }
  .ai-body{ flex:1; min-height:0; overflow-y:auto; padding:14px 15px; display:flex; flex-direction:column; gap:14px; }
  .chat-turn{ display:flex; flex-direction:column; gap:7px; }
  .chat-turn.user{ align-self:flex-end; align-items:flex-end; max-width:90%; }
  .chat-turn.ai{ align-self:stretch; }
  .ai-row{ display:flex; gap:9px; align-items:flex-start; }
  .ai-row .bubble{ flex:1; min-width:0; }
  .bubble{ font-size:12.8px; line-height:1.6; }
  .chat-turn.user .bubble{ background:var(--brand-bg); border:1px solid var(--border); color:var(--text); border-radius:2px; padding:8px 11px; }
  .chat-turn.ai .bubble{ border-left:1px solid var(--border-strong); padding:1px 0 1px 11px; color:var(--text); }
  .chat-chips{ display:flex; flex-wrap:wrap; gap:6px; padding-left:26px; }
  .chat-chip{ font-family:var(--font-mono); font-size:10px; font-weight:500; letter-spacing:.04em; padding:5px 9px; border-radius:2px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; text-align:left; }
  .chat-chip:hover{ border-color:var(--brand); color:var(--brand); background:var(--brand-bg); }
  .chat-chip.critical{ color:var(--critical-ink); border-color:var(--critical); background:var(--critical-bg); }
  .typing{ display:flex; gap:4px; padding:6px 0 6px 11px; border-left:1px solid var(--border-strong); width:fit-content; }
  .typing span{ width:4px; height:4px; background:var(--text-faint); animation:blink 1.1s infinite ease-in-out; }
  .typing span:nth-child(2){ animation-delay:.15s; } .typing span:nth-child(3){ animation-delay:.3s; }
  @keyframes blink{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }
  .ai-suggest{ display:flex; flex-wrap:wrap; gap:6px; padding:0 15px 12px; }
  .ai-input{ display:flex; gap:8px; padding:11px 15px 14px; border-top:1px solid var(--chrome-border); }
  .ai-input input{ flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:var(--r); padding:8px 10px; font-size:12.5px; }
  .ai-input input::placeholder{ color:var(--text-faint); }
  .ai-input button{ width:34px; height:34px; border-radius:var(--r); border:1px solid var(--brand); background:var(--brand); color:var(--surface); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; }
  .ai-input button svg{ width:15px; height:15px; }

  .alert-card{ border-radius:2px; padding:12px 13px; background:var(--surface); border:1px solid var(--border); border-left:2px solid var(--critical); display:flex; flex-direction:column; gap:8px; }
  .alert-card.medium{ border-left-color:var(--warn); }
  .alert-card .a-head{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .alert-card .a-what{ font-size:12.8px; font-weight:600; color:var(--text); line-height:1.45; }
  .alert-card .a-body p{ margin:0; font-size:12px; color:var(--text-muted); line-height:1.55; }
  .alert-card .a-impact{ font-family:var(--font-mono); font-size:11px; font-weight:600; letter-spacing:.03em; }
  .alert-card .a-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .ack-btn{ font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; padding:5px 9px; border-radius:2px; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); cursor:pointer; white-space:nowrap; }
  .ack-btn:hover{ border-color:var(--brand); color:var(--brand); background:var(--brand-bg); }
  .ack-btn.done{ background:var(--good-bg); color:var(--good-ink); border-color:var(--good); cursor:default; }
  .empty-note{ font-size:12.2px; color:var(--text-muted); line-height:1.6; padding:2px 0 2px 13px; border-left:1px solid var(--border-strong); }
  .chat-intro{ border-left:1px solid var(--border-strong); padding:1px 0 1px 13px; }
  .chat-intro .ci-mark{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); margin-bottom:9px; }
  .chat-intro p{ margin:0; font-size:12.5px; line-height:1.65; color:var(--text-muted); }
  .chat-intro p b{ color:var(--text); font-weight:600; }
  .chat-intro .ci-sources{ display:flex; flex-direction:column; gap:6px; margin-top:14px; padding-top:12px; border-top:1px solid var(--border); font-family:var(--font-mono); font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .chat-intro .ci-sources span{ display:flex; align-items:center; gap:7px; }
  .chat-intro .sc-dot{ width:5px; height:5px; flex-shrink:0; }

  /* ---------- Quotation Assistant ---------- */
  .quote-grid{ display:grid; grid-template-columns:288px 1fr 348px; gap:16px; align-items:start; }
  @media (max-width:1440px){ .quote-grid{ grid-template-columns:1fr; } }
  .field{ margin-bottom:13px; }
  .field label{ display:block; font-family:var(--font-mono); font-size:9px; font-weight:600; color:var(--text-faint); text-transform:uppercase; letter-spacing:.13em; margin-bottom:5px; }
  .field .static{ font-size:12.8px; padding:8px 10px; background:var(--surface-2); border-radius:2px; border:1px solid var(--border); line-height:1.5; }
  .slider-row{ display:flex; align-items:center; gap:12px; }
  .slider-row input[type=range]{ flex:1; accent-color:var(--brand); }
  .slider-row .slider-val{ font-family:var(--font-display); font-size:20px; font-weight:600; width:58px; text-align:right; letter-spacing:-.02em; }
  .ref-card{ padding:13px 14px; margin-bottom:11px; }
  .ref-card h4{ margin:0 0 4px; font-size:14px; font-weight:600; }
  .ref-card .rc-margin{ font-family:var(--font-mono); font-size:10.5px; letter-spacing:.03em; color:var(--text-muted); margin-bottom:9px; }
  .ref-card .rc-fact{ font-size:12px; line-height:1.55; padding:9px 10px; border-radius:2px; background:var(--warn-bg); color:var(--warn-ink); display:flex; gap:8px; align-items:flex-start; border-left:2px solid var(--warn); }
  .ref-card .rc-fact svg{ width:14px; height:14px; flex-shrink:0; margin-top:2px; }
  .formula-box{ background:var(--surface-2); border:1px solid var(--border); border-radius:2px; padding:11px 13px; font-family:var(--font-mono); font-size:11px; line-height:1.7; color:var(--text-muted); margin:12px 0 14px; }
  .formula-box .f-result{ font-family:var(--font-display); font-size:22px; font-weight:600; color:var(--text); margin-top:7px; letter-spacing:-.02em; }
  .risk-note-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px; }
  .risk-note-list li{ font-size:12px; line-height:1.55; background:var(--critical-bg); color:var(--critical-ink); padding:9px 10px; border-radius:2px; display:flex; gap:8px; border-left:2px solid var(--critical); }
  .risk-note-list li svg{ width:14px; height:14px; flex-shrink:0; margin-top:2px; }
  .footer-note{ font-size:11.5px; color:var(--text-faint); margin-top:13px; padding-top:11px; border-top:1px solid var(--border); line-height:1.55; }

  /* ---------- toasts ---------- */
  .toast-stack{ position:fixed; right:20px; bottom:20px; display:flex; flex-direction:column-reverse; gap:9px; z-index:90; max-width:392px; }
  .toast{ background:var(--text); color:var(--bg); padding:12px 14px; border-radius:2px; font-size:12.5px; line-height:1.55; box-shadow:var(--elev); display:flex; gap:11px; align-items:flex-start; animation:toastIn .2s ease; }
  .toast.leaving{ animation:toastOut .18s ease forwards; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(4px); } }
  .toast .t-icon{ flex-shrink:0; margin-top:1px; opacity:.7; }
  .toast .t-icon svg{ width:14px; height:14px; }
  .toast button{ background:var(--bg); color:var(--text); border:none; border-radius:2px; padding:5px 9px; font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; flex-shrink:0; align-self:center; }

  /* ---------- topbar utilities ---------- */
  .notif-wrap{ position:relative; }
  .notif-dot{ position:absolute; top:-2px; right:-2px; width:8px; height:8px; border-radius:50%; background:var(--critical); border:2px solid var(--surface); }
  .notif-dropdown{ position:absolute; top:40px; right:0; width:344px; max-height:420px; overflow:auto; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r); box-shadow:var(--elev); z-index:70; display:none; }
  .notif-dropdown.open{ display:block; }
  .notif-dd-head{ font-family:var(--font-mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.13em; color:var(--text-faint); padding:11px 13px; border-bottom:1px solid var(--border); background:var(--surface-2); }
  .notif-item{ display:flex; gap:10px; padding:11px 13px; cursor:pointer; border-bottom:1px solid var(--border); }
  .notif-item:last-child{ border-bottom:none; }
  .notif-item:hover{ background:var(--surface-2); }
  .notif-item .ni-dot{ width:6px; height:6px; margin-top:5px; flex-shrink:0; }
  .notif-item .ni-title{ font-size:12.2px; font-weight:500; line-height:1.45; }
  .notif-item .ni-sub{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-faint); margin-top:4px; }
  .notif-empty{ padding:22px 12px; text-align:center; color:var(--text-muted); font-size:12.2px; }

  .profile-chip{ display:flex; align-items:center; gap:9px; padding:4px 11px 4px 4px; border-radius:var(--r); background:var(--surface); border:1px solid var(--border); flex-shrink:0; cursor:pointer; }
  .profile-chip:hover{ border-color:var(--border-strong); }
  .avatar{ width:25px; height:25px; border-radius:2px; background:var(--brand-bg); border:1px solid var(--brand); color:var(--brand); font-family:var(--font-mono); font-size:9.5px; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .profile-text{ display:flex; flex-direction:column; line-height:1.3; }
  .profile-name{ font-size:11.5px; font-weight:600; }
  .profile-org{ font-family:var(--font-mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); }

  /* ---------- command palette ---------- */
  .search-scrim{ position:fixed; inset:0; background:rgba(16,17,20,.42); z-index:95; opacity:0; pointer-events:none; transition:opacity .15s; }
  .search-scrim.open{ opacity:1; pointer-events:auto; }
  .search-modal{ position:fixed; top:13%; left:50%; transform:translate(-50%,-6px); width:min(580px,90vw); max-height:70vh; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border-strong); border-radius:var(--r); box-shadow:var(--elev); z-index:96; opacity:0; pointer-events:none; transition:opacity .15s,transform .15s; }
  .search-modal.open{ opacity:1; pointer-events:auto; transform:translate(-50%,0); }
  .search-input-row{ display:flex; align-items:center; gap:11px; padding:13px 15px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .search-input-row svg{ width:16px; height:16px; color:var(--text-faint); flex-shrink:0; }
  .search-input-row input{ flex:1; border:none; background:transparent; font-size:14px; color:var(--text); outline:none; }
  .search-kbd{ font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); border:1px solid var(--border); border-radius:2px; padding:3px 6px; flex-shrink:0; }
  .search-results{ overflow:auto; }
  .search-group-label{ font-family:var(--font-mono); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.13em; color:var(--text-faint); padding:11px 15px 7px; background:var(--surface-2); border-bottom:1px solid var(--border); }
  .search-result-item{ display:flex; align-items:center; gap:11px; padding:10px 15px; cursor:pointer; border-bottom:1px solid var(--border); }
  .search-result-item:last-child{ border-bottom:none; }
  .search-result-item:hover,.search-result-item.active{ background:var(--surface-2); }
  .search-result-item .sr-icon{ width:26px; height:26px; border-radius:2px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-muted); }
  .search-result-item .sr-icon svg{ width:14px; height:14px; }
  .search-result-item .sr-title{ font-size:12.5px; font-weight:500; }
  .search-result-item .sr-sub{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.04em; color:var(--text-faint); margin-top:3px; }
  .search-empty{ padding:30px 20px; text-align:center; color:var(--text-muted); font-size:12.5px; }

  /* ---------- activity log ---------- */
  .activity-item{ display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--border); }
  .activity-item:last-child{ border-bottom:none; }
  .activity-item .act-icon{ width:23px; height:23px; border-radius:2px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-muted); }
  .activity-item .act-icon svg{ width:12px; height:12px; }
  .activity-item .act-text{ font-size:12.2px; color:var(--text); line-height:1.5; }
  .activity-item .act-text b{ font-weight:600; }
  .activity-item .act-time{ font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin-top:4px; }

  /* ---------- Connections & Settings ---------- */
  .conn-card{ display:flex; gap:14px; padding:16px 18px; align-items:flex-start; }
  .conn-icon{ width:38px; height:38px; border-radius:2px; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .conn-icon svg{ width:19px; height:19px; }
  .conn-stats{ display:flex; gap:1px; margin-top:13px; flex-wrap:wrap; background:var(--border); border:1px solid var(--border); border-radius:2px; overflow:hidden; }
  .conn-stat{ background:var(--surface); padding:9px 14px; flex:1; min-width:120px; }
  .conn-stat .cs-lbl{ font-family:var(--font-mono); font-size:8.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.11em; margin-bottom:3px; }
  .conn-stat .cs-val{ font-family:var(--font-display); font-size:16px; font-weight:600; letter-spacing:-.015em; }
  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 0; border-top:1px solid var(--border); }
  .toggle-row:first-of-type{ border-top:none; padding-top:2px; }
  .switch{ width:36px; height:20px; border-radius:99px; background:var(--surface-3); border:1px solid var(--border-strong); position:relative; cursor:pointer; flex-shrink:0; transition:background .15s,border-color .15s; }
  .switch.on{ background:var(--brand); border-color:var(--brand); }
  .switch::after{ content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:var(--surface); transition:transform .15s; }
  .switch.on::after{ transform:translateX(16px); }

  /* ---------- portfolio toolbar ---------- */
  .portfolio-toolbar{ display:flex; gap:8px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .search-box{ display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:7px 11px; flex:1; min-width:200px; max-width:300px; }
  .search-box svg{ width:14px; height:14px; color:var(--text-faint); flex-shrink:0; }
  .search-box input{ border:none; background:transparent; flex:1; font-size:12.5px; color:var(--text); outline:none; }
  .filter-chip{ font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; padding:7px 12px; border-radius:2px; border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer; }
  .filter-chip:hover{ border-color:var(--border-strong); color:var(--text); }
  .filter-chip.active{ background:var(--brand); color:var(--surface); border-color:var(--brand); }
  .no-results{ padding:40px 20px; text-align:center; color:var(--text-muted); }

  /* ---------- skeletons ---------- */
  .skeleton{ background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:skeletonShine 1.4s ease infinite; border-radius:var(--r); border:1px solid var(--border); }
  @keyframes skeletonShine{ 0%{ background-position:100% 50%; } 100%{ background-position:0 50%; } }
  .skeleton-kpi{ height:92px; }
  .skeleton-card{ height:152px; }

  .canvas > .fade-in{ animation:fadeUp .2s ease; }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:translateY(0); } }

  .scope-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:60px 20px; color:var(--text-muted); }
  .scope-empty svg{ width:36px; height:36px; opacity:.5; }


  /* =========================================================================
     DIAGNOSIS BAND — the analysis run and its verdict.
     Colour earns its place here: the bridge is the one place on the sheet where
     good/bad is the whole message, so it carries the semantic hues at full strength.
     ========================================================================= */
  .diagnosis{ border:1px solid var(--border); border-radius:var(--r); background:var(--surface); margin-bottom:16px; overflow:hidden; }
  .diagnosis .dg-head{ display:flex; align-items:center; gap:12px; padding:12px 16px 10px; border-bottom:1px solid var(--border); background:linear-gradient(180deg,var(--brand-bg),transparent); }
  .an-steps{ list-style:none; margin:0; padding:12px 16px; display:flex; flex-direction:column; gap:7px; border-bottom:1px solid var(--border); }
  .diagnosis.revealed .an-steps{ display:none; }
  .an-tick{ width:14px; height:14px; border:1px solid var(--border-strong); border-radius:2px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:transparent; transition:background .2s,border-color .2s,color .2s; }
  .an-step.active .an-tick{ border-color:var(--brand); background:var(--brand-bg); }
  .an-step.done .an-tick{ border-color:var(--good); background:var(--good); color:var(--surface); }
  .an-tick svg{ width:9px; height:9px; }
  .dg-body{ opacity:0; max-height:0; overflow:hidden; transition:opacity .3s ease .05s; }
  .diagnosis.revealed .dg-body{ opacity:1; max-height:none; overflow:visible; }
  @media (prefers-reduced-motion: reduce){ .dg-body{ transition:none; } }

  .dg-verdict{ display:flex; align-items:center; gap:16px; padding:16px; border-bottom:1px solid var(--border); }
  .dg-verdict p{ margin:0; font-size:15px; line-height:1.55; max-width:62ch; }
  .dg-verdict p b{ font-weight:600; }
  .dg-gauge{ width:74px; height:74px; border-radius:2px; border:1px solid var(--critical); background:var(--critical-bg); color:var(--critical-ink); display:flex; flex-direction:column; align-items:center; justify-content:center; flex-shrink:0; }
  .dg-gauge.under{ border-color:var(--good); background:var(--good-bg); color:var(--good-ink); }
  .dg-gap{ font-family:var(--font-display); font-size:28px; font-weight:700; line-height:1; letter-spacing:-.03em; }
  .dg-gap-lbl{ font-family:var(--font-mono); font-size:8px; line-height:1.25; letter-spacing:.1em; text-transform:uppercase; text-align:center; margin-top:4px; opacity:.8; }

  /* margin bridge */
  .bridge{ padding:14px 16px 16px; }
  .br-ends{ display:flex; align-items:center; gap:14px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .br-ends > span{ display:flex; flex-direction:column; gap:2px; }
  .br-ends > span:first-child{ flex:1; }
  .br-ends span.ra{ text-align:right; flex:1; align-items:flex-end; }
  .br-ends b{ font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:-.02em; }
  .br-ends em{ font-family:var(--font-mono); font-size:8.5px; font-style:normal; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
  .br-arrow{ color:var(--text-faint); display:flex; }
  .br-arrow svg{ width:18px; height:18px; }
  .br-row{ display:grid; grid-template-columns:186px 1fr 104px; align-items:center; gap:12px; padding:5px 6px; border-radius:2px; }
  .br-row.clickable{ cursor:pointer; }
  .br-row.clickable:hover{ background:var(--surface-2); }
  .br-lbl{ display:flex; align-items:center; gap:8px; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .br-plot{ position:relative; height:16px; }
  .br-axis{ position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--border-strong); }
  .br-bar{ position:absolute; top:3px; bottom:3px; border-radius:1px; }
  .br-bar.neg{ right:50%; }
  .br-bar.pos{ left:50%; }
  .br-val{ text-align:right; font-family:var(--font-mono); font-size:11.5px; font-weight:500; font-variant-numeric:tabular-nums; }
  .br-val.neg{ color:var(--critical); }
  .br-val.pos{ color:var(--good); }
  .br-foot{ font-size:11.5px; color:var(--text-faint); margin-top:12px; padding-top:10px; border-top:1px solid var(--border); line-height:1.55; }

  /* ---------- progress vs burn ---------- */
  .burn{ display:flex; flex-direction:column; gap:9px; }
  .burn-row{ display:grid; grid-template-columns:90px 1fr 52px; align-items:center; gap:12px; }
  .burn-k{ font-family:var(--font-mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--text-faint); }
  .burn-track{ position:relative; height:12px; background:var(--surface-2); border:1px solid var(--border); border-radius:2px; overflow:hidden; }
  .burn-fill{ position:absolute; left:0; top:0; bottom:0; }
  .burn-fill.done{ background:var(--brand); }
  .burn-fill.ok{ background:var(--good); }
  .burn-fill.over{ background:repeating-linear-gradient(45deg,var(--critical) 0 5px,color-mix(in srgb,var(--critical) 72%,#fff) 5px 10px); }
  .burn-mark{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--text); }
  .burn-v{ text-align:right; font-family:var(--font-display); font-size:16px; font-weight:600; letter-spacing:-.02em; }
  .burn-v.bad{ color:var(--critical); }
  .burn-note{ font-size:12.5px; line-height:1.6; color:var(--text-muted); margin:12px 0 0; max-width:66ch; }

  .phase-strip{ display:grid; grid-template-columns:repeat(6,1fr); gap:1px; margin-top:16px; padding-top:14px; border-top:1px solid var(--border); }
  .ph-col{ display:flex; flex-direction:column; align-items:center; gap:6px; padding:0 4px; }
  .ph-bar-wrap{ height:56px; width:100%; display:flex; align-items:flex-end; justify-content:center; }
  .ph-bar{ width:82%; max-width:64px; background:var(--surface-3); border-radius:1px 1px 0 0; }
  .ph-col.past .ph-bar{ background:var(--brand); opacity:.45; }
  .ph-col.current .ph-bar{ background:var(--brand); }
  .ph-col.future .ph-bar{ background:var(--surface-3); }
  .ph-amt{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .ph-name{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); }
  .ph-col.current .ph-name{ color:var(--brand); font-weight:600; }
  .ph-col.current .ph-amt{ color:var(--text); font-weight:600; }
  .phase-legend{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); margin-top:12px; }
  .pl-cur{ width:10px; height:10px; background:var(--brand); border-radius:1px; flex-shrink:0; }

  /* ---------- consolidated variance table ---------- */
  .var-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .var-table th{ text-align:left; font-family:var(--font-mono); font-size:9px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-faint); font-weight:600; padding:8px 14px; border-bottom:1px solid var(--border-strong); }
  .var-table td{ padding:11px 14px; border-bottom:1px solid var(--border); }
  .var-table tbody tr{ cursor:pointer; }
  .var-table tbody tr:hover td{ background:var(--surface-2); }
  .var-table td:first-child{ display:table-cell; font-weight:500; white-space:nowrap; }
  .var-table td:first-child .cat-tick{ display:inline-block; vertical-align:-2px; margin-right:9px; }
  .var-table .ta-r{ text-align:right; }
  .var-table tfoot td{ border-bottom:none; border-top:1px solid var(--border-strong); font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); padding-top:10px; padding-bottom:12px; }
  .var-table tfoot td:first-child{ font-size:9px; letter-spacing:.12em; color:var(--text-faint); }
  .var-plot{ position:relative; }
  .vp-axis{ position:absolute; left:50%; top:8px; bottom:8px; width:1px; background:var(--border-strong); }
  .vp-bar{ position:absolute; top:calc(50% - 4px); height:8px; border-radius:1px; }
  .vp-bar.over{ left:50%; background:var(--critical); }
  .vp-bar.under{ right:50%; background:var(--good); }
  .delta-chip{ display:inline-block; font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.05em; padding:3px 7px; border-radius:2px; border:1px solid currentColor; }
  .delta-chip.over{ color:var(--critical-ink); background:var(--critical-bg); }
  .delta-chip.under{ color:var(--good-ink); background:var(--good-bg); }
  .row-go{ color:var(--text-faint); display:inline-flex; }
  .row-go svg{ width:13px; height:13px; }
  .var-table tbody tr:hover .row-go{ color:var(--brand); }

  /* ---------- drill-down: summary, vendors, crew ---------- */
  .dd-summary{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:2px; overflow:hidden; margin-bottom:20px; border-top:2px solid var(--accent,var(--brand)); }
  .dds-stat{ background:var(--surface); padding:10px 13px; display:flex; flex-direction:column; gap:3px; }
  .dds-k{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); }
  .dds-v{ font-family:var(--font-display); font-size:16px; font-weight:600; letter-spacing:-.015em; }
  .dds-v.strong{ font-size:18px; }
  .dds-v.bad{ color:var(--critical); font-size:13.5px; }
  .dds-v.good{ color:var(--good); font-size:13.5px; }
  .dd-sec{ margin-bottom:22px; }
  .dd-note{ font-size:11.5px; color:var(--text-faint); line-height:1.55; margin-top:10px; }
  .src-tag{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--border); border-radius:2px; padding:2px 6px; color:var(--text-muted); background:var(--surface-2); }

  .vendor-list{ display:flex; flex-direction:column; }
  .vendor-row{ display:grid; grid-template-columns:1fr 120px 34px 92px 58px; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px; }
  .vendor-row:last-child{ border-bottom:none; }
  .v-name{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .v-track{ position:relative; height:8px; background:var(--surface-2); border-radius:1px; }
  .v-bar{ position:absolute; left:0; top:0; bottom:0; border-radius:1px; }
  .v-share,.v-cnt{ font-family:var(--font-mono); font-size:10px; color:var(--text-faint); text-align:right; }
  .v-amt{ font-family:var(--font-mono); font-size:11.5px; text-align:right; font-variant-numeric:tabular-nums; }

  .crew-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:2px; overflow:hidden; margin-bottom:14px; }
  .crew-stats > div{ background:var(--surface); padding:9px 12px; display:flex; flex-direction:column; gap:2px; }
  .cs-k{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--text-faint); }
  .cs-v{ font-family:var(--font-display); font-size:16px; font-weight:600; letter-spacing:-.015em; }
  .cs-v.warnv{ color:var(--warn); }
  .crew-table td{ vertical-align:middle; }
  .crew-table td:first-child,.crew-table td:nth-child(2){ font-family:var(--font-ui); font-size:12px; color:var(--text); }
  .crew-id{ display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:var(--text-faint); margin-top:2px; }
  .role-chip{ display:inline-block; font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--border); border-radius:2px; padding:3px 6px; color:var(--text-muted); background:var(--surface-2); white-space:nowrap; }
  .crew-table tr.ot-hot td{ background:var(--warn-bg); }
  .crew-table tr.ot-hot:hover td{ background:var(--warn-bg); }
  .crew-table td.bad{ color:var(--critical); font-weight:600; }
  .ot-track{ display:inline-block; width:56px; height:7px; background:var(--surface-3); border-radius:1px; position:relative; vertical-align:middle; margin-right:8px; }
  .ot-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--warn); border-radius:1px; }
  .ot-pc{ font-family:var(--font-mono); font-size:10px; color:var(--text-muted); }
  .over-quote{ display:inline-block; font-family:var(--font-mono); font-size:9px; letter-spacing:.05em; text-transform:uppercase; color:var(--critical-ink); background:var(--critical-bg); border:1px solid var(--critical); border-radius:2px; padding:2px 5px; margin-left:6px; white-space:nowrap; }
  .cap{ text-transform:capitalize; }
  .ta-r{ text-align:right; }

  /* ---------- alerts panel ---------- */
  .alert-lead{ display:flex; align-items:center; gap:11px; font-size:12px; line-height:1.5; color:var(--text-muted); padding-bottom:12px; border-bottom:1px solid var(--border); }
  .al-count{ font-family:var(--font-display); font-size:26px; font-weight:700; color:var(--critical); letter-spacing:-.03em; line-height:1; }
  .alert-card{ border-radius:2px; padding:12px 13px; background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--critical); display:flex; flex-direction:column; gap:7px; text-align:left; }
  .alert-card.medium{ border-left-color:var(--warn); }
  .alert-card.acked{ opacity:.6; }
  .alert-card .a-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .a-sev{ font-family:var(--font-mono); font-size:8.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--critical-ink); background:var(--critical-bg); border:1px solid var(--critical); border-radius:2px; padding:2px 6px; }
  .alert-card.medium .a-sev{ color:var(--warn-ink); background:var(--warn-bg); border-color:var(--warn); }
  .a-cat{ display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
  .alert-card .a-impact{ margin-left:auto; font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--critical); }
  .alert-card.medium .a-impact{ color:var(--warn); }
  .alert-card .a-what{ font-size:13px; font-weight:600; color:var(--text); line-height:1.45; }
  .alert-card .a-why{ font-size:11.5px; color:var(--text-muted); line-height:1.55; }
  .alert-card .a-foot{ display:flex; align-items:center; gap:8px; justify-content:space-between; margin-top:2px; }
  .alert-card .a-foot .btn svg{ width:12px; height:12px; }
  .alert-card.compact{ cursor:pointer; display:grid; grid-template-columns:auto 1fr; gap:6px 9px; align-items:center; }
  .alert-card.compact:hover{ border-color:var(--brand); }
  .alert-card.compact .a-what{ font-size:12.2px; }
  .alert-card.compact .a-proj{ grid-column:2; font-family:var(--font-mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); }

  /* ---------- alert drawer ---------- */
  .alert-scrim{ position:fixed; inset:0; background:rgba(16,17,20,.34); z-index:55; opacity:0; pointer-events:none; transition:opacity .18s; }
  .alert-scrim.open{ opacity:1; pointer-events:auto; }
  .alert-drawer{ position:fixed; top:0; bottom:0; right:0; width:min(560px,84vw); background:var(--surface); border-left:1px solid var(--border-strong); box-shadow:var(--elev); transform:translateX(102%); transition:transform .22s ease; z-index:56; display:flex; flex-direction:column; pointer-events:none; }
  .alert-drawer.open{ transform:translateX(0); pointer-events:auto; }
  .ad-head{ display:flex; align-items:center; gap:12px; padding:13px 18px; border-bottom:1px solid var(--border); background:var(--critical-bg); flex-shrink:0; }
  .ad-head.sev-medium{ background:var(--warn-bg); }
  .ad-id{ margin-left:auto; font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; color:var(--text-muted); }
  .ad-body{ flex:1; min-height:0; overflow-y:auto; padding:20px 18px 36px; }
  .ad-title{ font-size:21px; font-weight:600; line-height:1.3; margin:0 0 14px; max-width:26ch; }
  .ad-impact{ display:flex; align-items:baseline; gap:11px; padding:12px 14px; border:1px solid var(--border); border-radius:2px; background:var(--surface-2); margin-bottom:22px; }
  .ad-impact.neg{ border-color:var(--critical); background:var(--critical-bg); }
  .adi-v{ font-family:var(--font-display); font-size:26px; font-weight:700; letter-spacing:-.03em; }
  .ad-impact.neg .adi-v{ color:var(--critical-ink); }
  .adi-k{ font-family:var(--font-mono); font-size:9px; letter-spacing:.11em; text-transform:uppercase; color:var(--text-muted); }
  .ad-sec{ margin-bottom:22px; }
  .ad-p{ font-size:13px; line-height:1.65; color:var(--text-muted); margin:0 0 9px; max-width:60ch; }
  .ad-p:last-child{ margin-bottom:0; }
  .ad-crew{ display:grid; grid-template-columns:1fr 84px 62px; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .ad-crew:last-child{ border-bottom:none; }
  .adc-name{ font-size:12.5px; display:flex; flex-direction:column; gap:2px; }
  .adc-name em{ font-family:var(--font-mono); font-size:9px; font-style:normal; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .adc-ot{ font-family:var(--font-mono); font-size:11px; text-align:right; color:var(--warn); font-weight:600; }
  .ad-ev{ display:grid; grid-template-columns:76px 1fr auto; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 11px; border:1px solid var(--border); border-radius:2px; background:var(--surface); cursor:pointer; margin-bottom:6px; }
  .ad-ev:hover{ border-color:var(--brand); background:var(--brand-bg); }
  .ade-id{ font-family:var(--font-mono); font-size:10.5px; font-weight:600; color:var(--text); }
  .ade-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .ade-body b{ font-size:12.2px; font-weight:600; }
  .ade-body em{ font-size:11px; font-style:normal; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ade-amt{ font-family:var(--font-mono); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .ad-rec{ display:flex; gap:10px; align-items:flex-start; font-size:13px; line-height:1.6; padding:12px 13px; border:1px solid var(--brand); border-radius:2px; background:var(--brand-bg); color:var(--text); }
  .ad-rec svg{ width:15px; height:15px; flex-shrink:0; margin-top:3px; color:var(--brand); }
  .ad-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .ad-fine{ font-size:11px; color:var(--text-faint); margin:10px 0 0; line-height:1.5; }

  .ai-fine{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.06em; color:var(--text-faint); padding:0 15px 12px; line-height:1.5; }


  /* analysis run — step rows now carry what each step found */
  .an-step{ display:grid; grid-template-columns:16px 1fr auto; align-items:center; gap:11px; font-family:var(--font-mono); font-size:10.5px; letter-spacing:.03em; color:var(--text-faint); opacity:.4; transition:opacity .25s,color .25s; }
  .an-step.active{ opacity:1; color:var(--brand); }
  .an-step.done{ opacity:1; color:var(--text-muted); }
  .an-t{ display:flex; align-items:baseline; gap:9px; min-width:0; }
  .an-t em{ font-style:normal; font-size:8.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--text-faint); white-space:nowrap; }
  .an-r{ text-align:right; color:var(--text-faint); opacity:0; transition:opacity .25s; white-space:nowrap; }
  .an-step.done .an-r{ opacity:1; color:var(--text); }
  .an-step.active .an-r{ opacity:.5; }

  /* attention strip — the alerts, folded onto the sheet beside the numbers */
  .attention{ border-top:1px solid var(--border); padding:14px 16px 6px; }
  .att-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .att-k{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--critical); }
  .att-sub{ font-family:var(--font-mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); }
  .att-list{ display:flex; flex-direction:column; gap:6px; }
  .att-item{ display:grid; grid-template-columns:auto 1fr auto 14px; align-items:center; gap:12px; width:100%; text-align:left; padding:9px 11px; border:1px solid var(--border); border-left:3px solid var(--critical); border-radius:2px; background:var(--surface); cursor:pointer; }
  .att-item.medium{ border-left-color:var(--warn); }
  .att-item:hover{ background:var(--surface-2); border-color:var(--border-strong); }
  .att-item.medium:hover{ border-left-color:var(--warn); }
  .att-item:hover{ border-left-color:var(--critical); }
  .att-item.acked{ opacity:.5; }
  .att-sev{ font-family:var(--font-mono); font-size:8.5px; font-weight:600; letter-spacing:.13em; text-transform:uppercase; color:var(--critical-ink); background:var(--critical-bg); border:1px solid var(--critical); border-radius:2px; padding:2px 6px; }
  .att-item.medium .att-sev{ color:var(--warn-ink); background:var(--warn-bg); border-color:var(--warn); }
  .att-what{ font-size:12.5px; font-weight:500; }
  .att-imp{ font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--critical); white-space:nowrap; }
  .att-item.medium .att-imp{ color:var(--warn); }
  .att-go{ color:var(--text-faint); display:flex; }
  .att-go svg{ width:13px; height:13px; }
  .br-flag{ display:inline-flex; align-items:center; justify-content:center; width:14px; height:14px; margin-left:7px; border-radius:2px; font-family:var(--font-mono); font-size:9px; font-weight:700; color:var(--surface); background:var(--critical); }
  .br-flag.medium{ background:var(--warn); }

  /* the retrospective read */
  .lesson{ display:flex; gap:12px; align-items:flex-start; margin:0 16px 16px; padding:13px 14px; border:1px solid var(--border); border-left:2px solid var(--brand); border-radius:2px; background:var(--surface-2); }
  .lesson > div{ font-size:13px; line-height:1.6; max-width:64ch; }
  .ls-k{ display:block; font-family:var(--font-mono); font-size:9px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--brand); margin-bottom:6px; }
  .var-row.flat{ cursor:default; }


  /* ---------- Quotation Assistant: margin entry + comparable search ---------- */
  .margin-input{ display:flex; align-items:baseline; gap:6px; border:1px solid var(--border); border-radius:2px; background:var(--surface); padding:8px 12px; }
  .margin-input input{ flex:1; border:none; background:transparent; outline:none; color:var(--text); font-family:var(--font-display); font-size:26px; font-weight:600; letter-spacing:-.02em; width:100%; -moz-appearance:textfield; }
  .margin-input input::-webkit-outer-spin-button,.margin-input input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .margin-input:focus-within{ border-color:var(--brand); }
  .mi-unit{ font-family:var(--font-display); font-size:19px; font-weight:600; color:var(--text-faint); }
  .mi-scale{ display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:8.5px; letter-spacing:.1em; color:var(--text-faint); margin-top:3px; }

  .qsearch{ border:1px solid var(--border); border-radius:var(--r); background:var(--surface); padding:14px 16px; margin-bottom:18px; }
  .scan-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .sc-row{ display:grid; grid-template-columns:18px 1fr 1.2fr auto; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--border); opacity:.35; transition:opacity .3s; }
  .sc-row:last-child{ border-bottom:none; }
  .sc-row.active{ opacity:1; }
  .sc-row.done{ opacity:1; }
  .sc-row.done:not(.matched){ opacity:.5; }
  .sc-tick{ width:18px; height:18px; border:1px solid var(--border-strong); border-radius:2px; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); flex-shrink:0; transition:background .25s,border-color .25s,color .25s; }
  .sc-tick svg{ width:10px; height:10px; }
  .sc-row.active .sc-tick{ border-color:var(--brand); background:var(--brand-bg); color:var(--brand); }
  .sc-row.done.matched .sc-tick{ border-color:var(--good); background:var(--good); color:var(--surface); }
  .sc-name{ display:flex; flex-direction:column; gap:2px; font-size:12.5px; font-weight:500; min-width:0; }
  .sc-name em{ font-family:var(--font-mono); font-size:8.5px; font-style:normal; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); }
  .sc-why{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.05em; color:var(--text-faint); opacity:0; transition:opacity .3s; }
  .sc-row.done .sc-why{ opacity:1; }
  .sc-row.done.matched .sc-why{ color:var(--good); }
  .sc-score{ font-family:var(--font-mono); font-size:10.5px; text-align:right; color:var(--text-faint); opacity:0; transition:opacity .3s; white-space:nowrap; }
  .sc-row.done .sc-score{ opacity:1; }
  .sc-row.done.matched .sc-score{ color:var(--text); font-weight:600; }
  .scan-result{ font-size:12.5px; line-height:1.6; color:var(--text-muted); margin-top:12px; padding-top:12px; border-top:1px solid var(--border); opacity:0; max-height:0; overflow:hidden; transition:opacity .35s; }
  .qsearch.revealed .scan-result{ opacity:1; max-height:none; }
  .scan-result b{ color:var(--text); }

  .ref-grid{ display:flex; flex-direction:column; gap:10px; }
  .ref-card{ cursor:pointer; }
  .ref-card:hover{ border-color:var(--brand); }
  .rc-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:3px; }
  .rc-open{ margin-top:11px; }
  .rc-open svg{ width:12px; height:12px; }
  .match-list{ display:flex; flex-direction:column; gap:7px; }
  .match-row{ display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); }
  .mr-tick{ width:16px; height:16px; border-radius:2px; background:var(--good); color:var(--surface); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .mr-tick svg{ width:9px; height:9px; }


  /* ---------- cost driver: cause groups, incident rows, SAP B1 documents ---------- */
  .cause-list{ display:flex; flex-direction:column; gap:14px; }
  .cause-group{ border:1px solid var(--border); border-radius:2px; overflow:hidden; }
  .cause-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; padding:9px 12px; background:var(--warn-bg); border-bottom:1px solid var(--border); }
  .cause-name{ font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--warn-ink); }
  .cause-meta{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.05em; color:var(--text-muted); margin-left:auto; }
  .cause-row{ display:grid; grid-template-columns:76px 1fr auto auto 14px; align-items:center; gap:12px; width:100%; text-align:left; padding:10px 12px; border:none; border-top:1px solid var(--border); background:var(--surface); cursor:pointer; }
  .cause-row:first-of-type{ border-top:none; }
  .cause-row:hover{ background:var(--surface-2); }
  .cr-id{ font-family:var(--font-mono); font-size:10.5px; font-weight:600; color:var(--text); }
  .cr-desc{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .cr-desc b{ font-size:12.2px; font-weight:600; }
  .cr-desc em{ font-size:11px; font-style:normal; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cr-inc{ font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; border:1px solid var(--border); border-radius:2px; padding:2px 6px; color:var(--text-muted); }
  .cr-amt{ font-family:var(--font-mono); font-size:11.5px; font-variant-numeric:tabular-nums; }
  .cr-go{ color:var(--text-faint); display:flex; }
  .cr-go svg{ width:13px; height:13px; }
