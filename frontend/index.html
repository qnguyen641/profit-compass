/* =========================================================================
   EXPORT — a spend report, not a toast.
   What a controller actually wants on the way to a review meeting: the
   summary, the category variance, a register of every line that cost more
   than it should have with its cause and its SAP B1 references, the overtime
   incidents, and an honest note on which figures rest on inferred attribution.
   ========================================================================= */
function buildReport(pid){
  const p = project(pid), snap = snapshot(pid), d = buildDiagnosis(pid);
  const fc = forecastOf(pid), L = labourOf(pid);
  const budgetCost = budgetTotalCost(pid);
  const rows = TRANSACTIONS.filter(t=>t.project_id===pid || t.resolved_project_id===pid);
  const driven = rows.filter(t=>t.driver).sort((a,b)=>b.amount-a.amount);
  const inc = incidentsFor(pid).slice().sort((a,b)=>b.ot_hours-a.ot_hours);
  const inferred = rows.filter(t=>t.project_id===null);
  const inferredTotal = inferred.reduce((s,t)=>s+t.amount,0);
  const overQuote = rows.filter(t=>t.quoted_amount).reduce((s,t)=>s+(t.amount-t.quoted_amount),0);

  const cell = (k,v,cls) => `<div class="rp-stat"><span class="rp-k">${k}</span><span class="rp-v ${cls||''}">${v}</span></div>`;

  const catRows = CATS.map(c=>{
    const bud=budgetOf(pid,c), act=actualOf(pid,c), delta=act-bud, dp=Math.round(delta/bud*100);
    return `<tr>
      <td><span class="cat-tick" style="background:${catColorVar(c)}"></span>${catLabel(c)}</td>
      <td class="ta-r num">${fmtSGD(bud)}</td>
      <td class="ta-r num"><b>${fmtSGD(act)}</b></td>
      <td class="ta-r num">${snap.final?'—':fmtSGD(fc[c])}</td>
      <td class="ta-r num ${delta>0?'bad':'good'}">${delta>0?'+':''}${fmtSGD(delta)}</td>
      <td class="ta-r num ${delta>0?'bad':'good'}">${delta>0?'+':''}${dp}%</td>
    </tr>`;
  }).join('');
  const sums = CATS.reduce((a,c)=>({b:a.b+budgetOf(pid,c),a:a.a+actualOf(pid,c),f:a.f+fc[c]}),{b:0,a:0,f:0});

  const leakRows = driven.map(t=>{
    const over = t.quoted_amount ? t.amount-t.quoted_amount : null;
    const docs = (t.driver.docs || (t.driver.incident ? (incidentById(t.driver.incident)||{}).docs : []) || []);
    return `<tr>
      <td class="num">${t.id}</td>
      <td>${t.vendor}<em>${t.description}</em></td>
      <td><span class="rp-cause">${CAUSE_LABEL[t.driver.cause]||t.driver.cause}</span></td>
      <td class="rp-why">${t.driver.note}</td>
      <td class="rp-docs">${docs.length?docs.map(x=>`${x.type} ${x.ref}`).join('<br/>'):(t.driver.incident||'—')}</td>
      <td class="ta-r num">${fmtSGD(t.amount)}</td>
      <td class="ta-r num ${over?'bad':''}">${over?'+'+fmtSGD(over):'—'}</td>
    </tr>`;
  }).join('');

  const incRows = inc.map(i=>`<tr class="${i.kind==='unexplained'?'rp-unexplained':''}">
      <td class="num">${i.id}</td>
      <td>${i.title}${i.date?`<em>${i.date}</em>`:''}</td>
      <td>${i.doc?`${i.doc} · ${i.ref}`:'<b>no supporting document</b>'}</td>
      <td class="ta-r num">${i.ot_hours} h</td>
      <td class="ta-r num">${L?fmtSGD(i.ot_hours*L.summary.hourly_rate):'—'}</td>
    </tr>`).join('');

  const explained = L ? L.summary.overtime_hours - inc.filter(i=>i.kind==='unexplained').reduce((s,i)=>s+i.ot_hours,0) : 0;

  return `
  <div class="rp-sheet">
    <header class="rp-head">
      <div>
        <div class="rp-eyebrow">Q's Advertising · Profit Compass</div>
        <h1>Project spend report</h1>
        <div class="rp-sub">${p.name} · ${p.customer}</div>
      </div>
      <div class="rp-meta">
        <div><span>Project no.</span><b>${pid}</b></div>
        <div><span>Status</span><b>${snap.final?'Closed':`${p.lifecycle_stage} · ${p.completion_pct}% delivered`}</b></div>
        <div><span>Prepared</span><b>${new Date().toISOString().slice(0,10)}</b></div>
        <div><span>Sources</span><b>SAP Business One · Time &amp; Attendance</b></div>
      </div>
    </header>

    <section class="rp-sec">
      <h2>1 · Position</h2>
      <div class="rp-stats">
        ${cell('Revenue', fmtSGD(snap.revenue))}
        ${cell(snap.final?'Final cost':'Cost to date', fmtSGD(snap.actual_cost))}
        ${cell('Planned cost', fmtSGD(budgetCost))}
        ${cell('Profit', fmtSGD(snap.profit))}
        ${cell(snap.final?'Final margin':'Margin', pct(snap.margin_pct), snap.margin_pct<snap.budget_margin_pct?'bad':'good')}
        ${cell('Planned margin', pct(snap.budget_margin_pct))}
        ${cell(snap.final?'Variance to plan':'Forecast margin', snap.final?`${d.marginDrop>0?'−':'+'}${Math.abs(d.marginDrop)} pts`:pct(snap.forecast_final_margin_pct), 'bad')}
        ${cell('Budget spent', d.burnPct+'%', d.burnPct>d.donePct?'bad':'')}
      </div>
      <p class="rp-verdict">${d.verdict}</p>
    </section>

    <section class="rp-sec">
      <h2>2 · Spend by category</h2>
      <table class="rp-table">
        <thead><tr><th>Category</th><th class="ta-r">Plan</th><th class="ta-r">${snap.final?'Final':'Actual'}</th><th class="ta-r">Forecast</th><th class="ta-r">Variance</th><th class="ta-r">Δ</th></tr></thead>
        <tbody>${catRows}</tbody>
        <tfoot><tr><td>Tracked total</td><td class="ta-r num">${fmtSGD(sums.b)}</td><td class="ta-r num"><b>${fmtSGD(sums.a)}</b></td><td class="ta-r num">${snap.final?'—':fmtSGD(sums.f)}</td><td class="ta-r num ${sums.a>sums.b?'bad':'good'}">${sums.a>sums.b?'+':''}${fmtSGD(sums.a-sums.b)}</td><td class="ta-r num">${Math.round((sums.a-sums.b)/sums.b*100)}%</td></tr></tfoot>
      </table>
      <p class="rp-note">Tracked categories cover ${fmtSGD(sums.a)} of ${fmtSGD(snap.actual_cost)} total cost. The remainder sits in overhead and contingency lines not itemised at category level.</p>
    </section>

    <section class="rp-sec rp-break">
      <h2>3 · Where money went that should not have</h2>
      <p class="rp-lead">${driven.length} cost lines carry a named cause. ${overQuote>0?`${fmtSGD(overQuote)} of that is measurable overspend against a quote on file.`:''} Every reference below is a document in SAP Business One.</p>
      <table class="rp-table rp-leak">
        <thead><tr><th>Line</th><th>Vendor / description</th><th>Cause</th><th>What happened</th><th>SAP B1 records</th><th class="ta-r">Amount</th><th class="ta-r">Over quote</th></tr></thead>
        <tbody>${leakRows||'<tr><td colspan="7">No line on this project carries an identified cost driver.</td></tr>'}</tbody>
      </table>
    </section>

    ${L?`<section class="rp-sec rp-break">
      <h2>4 · Overtime and what caused it</h2>
      <p class="rp-lead">${L.summary.overtime_hours} overtime hours were worked by ${L.summary.craftsmen} craftsmen at ${fmtSGD(L.summary.hourly_rate)}/h. ${explained} of them (${Math.round(explained/L.summary.overtime_hours*100)}%) trace to a record in SAP Business One.</p>
      <table class="rp-table">
        <thead><tr><th>Ref</th><th>Incident</th><th>Record</th><th class="ta-r">Hours</th><th class="ta-r">Cost</th></tr></thead>
        <tbody>${incRows}</tbody>
      </table>
    </section>`:''}

    <section class="rp-sec">
      <h2>${L?'5':'4'} · Attribution exceptions</h2>
      ${inferred.length?`<p class="rp-lead">${fmtSGD(inferredTotal)} (${(inferredTotal/snap.actual_cost*100).toFixed(1)}% of cost) is attributed to this project by inference rather than by a project code on the source document.</p>
      <table class="rp-table">
        <thead><tr><th>Line</th><th>Vendor / description</th><th>Basis</th><th class="ta-r">Amount</th></tr></thead>
        <tbody>${inferred.map(t=>`<tr><td class="num">${t.id}</td><td>${t.vendor}<em>${t.description}</em></td><td><span class="rp-cause">${t.tag_status}${t.confidence?` · ${t.confidence}%`:''}</span> ${t.inherit_via||(t.driver?t.driver.note:'')}</td><td class="ta-r num">${fmtSGD(t.amount)}</td></tr>`).join('')}</tbody>
      </table>
      <p class="rp-note">Correcting an attribution is a change to the source document in SAP Business One. This workspace reads those documents; it does not write to them.</p>`
      :`<p class="rp-lead">Every cost line on this project carries a project code from the source document. No attribution is inferred.</p>`}
    </section>

    <footer class="rp-foot">
      Generated by Profit Compass from SAP Business One and the Time &amp; Attendance system.
      Read-only analysis — no figure in this report was written back to either source.
      Creating a draft quotation is the only action this workspace can take in SAP Business One, and only a person can trigger it.
    </footer>
  </div>`;
}

function openReport(pid){
  state.reportOpen = pid;
  document.getElementById('reportBody').innerHTML = buildReport(pid);
  document.getElementById('reportOverlay').classList.add('open');
  document.body.classList.add('report-mode');
}
function closeReport(){
  state.reportOpen = null;
  document.getElementById('reportOverlay').classList.remove('open');
  document.body.classList.remove('report-mode');
}

/* =========================================================================
   PERSISTENCE, TOASTS & ACTIVITY LOG
   ========================================================================= */
function saveAppState(){
  try{
    localStorage.setItem('pc_state_v1', JSON.stringify({
      screen: state.screen, selectedProject: state.selectedProject,
      ackStatus: state.ackStatus, insightOpen: state.insightOpen,
    }));
  }catch(e){}
}
function loadAppState(){
  try{
    const saved = JSON.parse(localStorage.getItem('pc_state_v1')||'null');
    if(saved && typeof saved==='object') Object.assign(state, saved);
  }catch(e){}
}

let ACTIVITY_LOG = [];
function timeAgo(ts){
  const s = Math.round((Date.now()-ts)/1000);
  if(s<5) return 'just now';
  if(s<60) return s+'s ago';
  const m = Math.round(s/60); if(m<60) return m+'m ago';
  const h = Math.round(m/60); return h+'h ago';
}
function logActivity(text, icon){
  ACTIVITY_LOG.unshift({ text, icon: icon||iconCheck(), ts: Date.now() });
  if(ACTIVITY_LOG.length>40) ACTIVITY_LOG.length = 40;
  renderActivityTab();
}

function toast(text, opts={}){
  const stack = document.getElementById('toastStack');
  if(!stack) return;
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="t-icon">${opts.icon || iconCheck()}</span><span style="flex:1">${text}</span>${opts.actionLabel ? `<button type="button">${opts.actionLabel}</button>` : ''}`;
  stack.appendChild(el);
  const dismiss = ()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(), 200); };
  const btn = el.querySelector('button');
  if(btn) btn.addEventListener('click', ()=>{ if(opts.onAction) opts.onAction(); dismiss(); });
  setTimeout(dismiss, opts.duration || 4800);
}

/* ---------- Skeleton loaders: a brief "fetching" beat on real navigation,
   so the app reads as pulling live data rather than swapping static text. ---------- */
function renderSkeleton(screen){
  const blocks = n => Array.from({length:n}, ()=>'<div class="card skeleton skeleton-card"></div>').join('');
  let html = '';
  if(screen==='A') html = `<div class="grid proj-grid">${blocks(6)}</div>`;
  else if(screen==='D') html = `<div class="quote-grid">${Array.from({length:3},()=> '<div class="card skeleton" style="height:440px;border-radius:14px"></div>').join('')}</div>`;
  else if(screen==='S') html = `<div class="grid" style="gap:16px">${blocks(3)}</div>`;
  else html = `<div class="grid" style="grid-template-columns:repeat(5,1fr);gap:1px;margin-bottom:16px">${Array.from({length:5},()=>'<div class="skeleton skeleton-kpi"></div>').join('')}</div>${blocks(3)}`;
  document.getElementById('canvas').innerHTML = html;
}
function navigateAndRender(delay=230){
  renderSkeleton(state.screen);
  setTimeout(render, delay);
}

/* ---------- The analysis run.
   A visible sequence rather than an instant answer: the point of the moment is
   that a verdict is *derived* from named sources, and you watch it happen. ---------- */
let analysisTimers = [];
function playAnalysis(){
  const wrap = document.getElementById('diagnosis');
  if(!wrap) return;
  const pid = wrap.dataset.pid;
  analysisTimers.forEach(clearTimeout); analysisTimers = [];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const steps = [...wrap.querySelectorAll('.an-step')];
  if(reduce){ steps.forEach(s=>s.classList.add('done')); wrap.classList.add('revealed'); state.analysisPlayed = pid; return; }

  wrap.classList.remove('revealed');
  steps.forEach(s=>s.classList.remove('done','active'));
  // Deliberately unhurried: each step holds long enough to read what it found
  // before the next begins. The point of the moment is that you can watch the
  // verdict being derived, source by source.
  const RUN = 900, HOLD = 520;
  steps.forEach((s,i)=>{
    analysisTimers.push(setTimeout(()=>s.classList.add('active'), i*RUN));
    analysisTimers.push(setTimeout(()=>{ s.classList.remove('active'); s.classList.add('done'); }, i*RUN + HOLD));
  });
  analysisTimers.push(setTimeout(()=>{
    wrap.classList.add('revealed'); state.analysisPlayed = pid;
  }, steps.length*RUN + 420));
}

function bindScreenEvents(){
  // Portfolio cards bind their own click handlers inside renderPortfolioGrid() (it
  // re-renders independently of the rest of Screen A for live search/filter), and
  // the "+ New Quote" card is (re)created there too — nothing to bind for either here.
  const psel = document.getElementById('projSwitch'); if(psel) psel.addEventListener('change', e=>{ state.selectedProject = e.target.value; navigateAndRender(); });
  document.querySelectorAll('[data-drill-category]').forEach(el=>el.addEventListener('click', ()=> openDrilldown(el.dataset.drillCategory)));
  document.querySelectorAll('[data-open-commitments]').forEach(el=>el.addEventListener('click', ()=> openCommitmentsDrawer(el.dataset.openCommitments)));
  const vab = document.getElementById('viewAllTxnsBtn'); if(vab) vab.addEventListener('click', ()=> openDrilldown(null, null, state.selectedProject));

  // AI Synthesis insight cards — expand/collapse toggles the DOM directly (no full
  // re-render) so the entrance animation doesn't replay and scroll position holds.
  document.querySelectorAll('[data-insight-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const cat = el.dataset.insightToggle;
    state.insightOpen[cat] = !state.insightOpen[cat];
    el.closest('.insight-card').classList.toggle('open', state.insightOpen[cat]);
    saveAppState();
  }));
  document.querySelectorAll('[data-trace-txn]').forEach(el=>el.addEventListener('click', ()=> openDrilldown(el.dataset.traceCat, el.dataset.traceTxn)));
  document.querySelectorAll('[data-ask-ai]').forEach(el=>el.addEventListener('click', ()=> askAiAboutCategory(el.dataset.askAi)));

  // Margin can be typed or dragged; the two stay in step and everything derived
  // from them updates live.
  const mSlider = document.getElementById('marginSlider');
  const mInput  = document.getElementById('marginInput');
  function setMargin(v, from){
    const n = Math.min(60, Math.max(5, parseFloat(v)));
    if(isNaN(n)) return;
    quoteMarginPct = n;
    if(from!=='slider' && mSlider) mSlider.value = Math.min(45, Math.max(10, n));
    if(from!=='input'  && mInput)  mInput.value  = n;
    const echo = document.getElementById('marginEcho'); if(echo) echo.textContent = n;
    const out = document.getElementById('contractValOut'); if(out) out.textContent = fmtSGD(suggestedContractValue(n));
  }
  if(mSlider) mSlider.addEventListener('input', e=>setMargin(e.target.value,'slider'));
  document.querySelectorAll('.ml-row').forEach(el=>el.addEventListener('click', ()=>{
    quoteMarginPct = parseFloat(el.dataset.margin); render();
  }));
  const cmi = document.getElementById('customMarginInput');
  if(cmi){
    cmi.addEventListener('input', e=>{
      const n = parseFloat(e.target.value);
      const out = document.getElementById('customMarginOut');
      if(out) out.textContent = (!isNaN(n) && n>=5 && n<=60) ? fmtSGD(quotePrice(n)) : '';
    });
    cmi.addEventListener('change', e=>{
      const n = parseFloat(e.target.value);
      if(!isNaN(n) && n>=5 && n<=60){ quoteMarginPct = n; render(); }
    });
  }
  const runSearch = document.getElementById('runSearchBtn');
  if(runSearch) runSearch.addEventListener('click', ()=>{ state.quoteSearched=false; quoteRunning=true; render(); setTimeout(playQuoteSearch, 60); });
  document.querySelectorAll('[data-evidence-open]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation(); openEvidenceDrawer(el.dataset.evidenceOpen);
  }));
  document.querySelectorAll('[data-evidence]').forEach(el=>el.addEventListener('click', ()=> openEvidenceDrawer(el.dataset.evidence)));

  const appr = document.getElementById('approveQuoteBtn');
  if(appr) appr.addEventListener('click', async ()=>{
    appr.disabled = true;
    try{
      const price = quotePrice(quoteMarginPct);
      const r = await fetch('api/quotes', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ margin_pct: quoteMarginPct, contract_value: price, cost_base: costBaseForMargin() }) });
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d = await r.json();
      QUOTE_DRAFTS.push(d);
      logActivity(`Draft quotation <b>${d.qr_id} rev ${d.rev}</b> created in the B1 pipeline — ${fmtSGD(d.contract_value)} at ${d.margin_pct}% margin.`, iconFile());
      toast(`Draft ${d.qr_id} rev ${d.rev} written to the SAP B1 pipeline (simulated). A person approves and sends it from B1.`, { icon: iconCheck() });
      render();
    }catch(e){
      toast('Could not reach the backend — no draft was created.', { icon: iconAlert() });
      appr.disabled = false;
    }
  });
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    openReport(state.selectedProject);
    logActivity(`Generated a spend report for <b>${project(state.selectedProject).name}</b>.`, iconFile());
  });

  // Portfolio search & status filter
  const pSearch = document.getElementById('portfolioSearch');
  if(pSearch) pSearch.addEventListener('input', e=>{ state.portfolioQuery = e.target.value; renderPortfolioGrid(); });
  document.querySelectorAll('[data-filter-status]').forEach(el=>el.addEventListener('click', ()=>{
    state.portfolioFilter = el.dataset.filterStatus;
    document.querySelectorAll('[data-filter-status]').forEach(c=>c.classList.toggle('active', c===el));
    renderPortfolioGrid();
  }));

  // (Transaction table sort headers bind themselves inside renderDrilldown(), since
  // the table is (re)created independently of the main screen render.)

  // Connections & Settings toggles (visual only)
  document.querySelectorAll('[data-toggle-switch]').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.toggleSwitch;
    state.settingsToggles[key] = !state.settingsToggles[key];
    el.classList.toggle('on', state.settingsToggles[key]);
    saveAppState();
  }));

  // Diagnosis: play the run on first arrival, replay on demand
  const rerun = document.getElementById('rerunAnalysis');
  if(rerun) rerun.addEventListener('click', ()=>{ state.analysisPlayed=null; playAnalysis(); });
  const dg = document.getElementById('diagnosis');
  if(dg && state.analysisPlayed !== dg.dataset.pid) setTimeout(playAnalysis, 120);
}

function bindStaticEvents(){
  document.querySelectorAll('.rail-btn[data-nav]').forEach(b=>b.addEventListener('click', ()=>{
    if(state.screen===b.dataset.nav) return;
    state.screen=b.dataset.nav; navigateAndRender();
  }));
  document.getElementById('ddClose').addEventListener('click', closeDrilldown);
  document.getElementById('ddScrim').addEventListener('click', closeDrilldown);


  document.getElementById('alertScrim').addEventListener('click', closeAlertDrawer);
  document.getElementById('reportClose').addEventListener('click', closeReport);
  document.getElementById('reportPrint').addEventListener('click', ()=>{ try{ window.print(); }catch(e){ toast('Printing is blocked in this preview — open the file directly to print.', { icon: iconInfo() }); } });

  document.body.addEventListener('click', (e)=>{
    const alertBtn = e.target.closest('[data-alert-open]');
    if(alertBtn){ openAlertDrawer(alertBtn.dataset.alertOpen); return; }
    const xProj = e.target.closest('[data-open-project-alert]');
    if(xProj){
      state.screen='B'; state.selectedProject = xProj.dataset.openProjectAlert;
      navigateAndRender();
      setTimeout(()=>openAlertDrawer(xProj.dataset.alert), 420);
      return;
    }
    const openChat = e.target.closest('[data-open-chat-project]');
    if(openChat){
      state.screen='B'; state.selectedProject = openChat.dataset.openChatProject; navigateAndRender(); return;
    }
    const chip = e.target.closest('[data-suggest]');
    if(chip){ runSuggestedChat(chip.dataset.suggest); return; }
    const drillChip = e.target.closest('[data-drill-chip]');
    if(drillChip){
      state.chatLog.push({role:'user', text:`(tapped) ${drillChip.textContent}`});
      renderChatTab();
      if(state.screen!=='B'){ state.screen='B'; state.selectedProject='PRJ-001'; render(); }
      openDrilldown(drillChip.dataset.drillChip);
      return;
    }
    const flagTog = e.target.closest('#flaggedToggle');
    if(flagTog){ state.ddFlaggedOnly = !state.ddFlaggedOnly; renderDrilldown(); return; }
    const ack = e.target.closest('[data-ack]');
    if(ack && !state.ackStatus[ack.dataset.ack]){
      state.ackStatus[ack.dataset.ack]=true;
      if(state.screen==='B') render();
      const alert = RISK_ALERTS.find(r=>r.id===ack.dataset.ack);
      toast(`Marked as reviewed — a note in this workspace only. Nothing was written to SAP Business One.`, { icon: iconCheck() });
      logActivity(`Marked reviewed on <b>${project(alert.project_id).name}</b>: ${alert.what_happened}`, iconAlert());
      renderNotifDropdown(); saveAppState();
      if(state.alertOpen === ack.dataset.ack) openAlertDrawer(state.alertOpen);
      return;
    }
  });

  const themeBtn = document.getElementById('themeToggle');
  function syncThemeIcon(){
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.getElementById('themeIconSun').style.display = dark ? '' : 'none';
    document.getElementById('themeIconMoon').style.display = dark ? 'none' : '';
  }
  themeBtn.addEventListener('click', ()=>{
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur==='dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem('pc_theme', JSON.stringify(next)); }catch(e){}
    syncThemeIcon();
  });
  syncThemeIcon();

  const mobileToggle = document.getElementById('mobileAiToggle');
  function checkMobile(){ mobileToggle.style.display = window.innerWidth<=1020 ? 'flex' : 'none'; }
  window.addEventListener('resize', checkMobile); checkMobile();
  mobileToggle.addEventListener('click', ()=> document.getElementById('aiPanel').classList.toggle('open'));

  // Notifications bell — cross-portfolio digest
  const notifBtn = document.getElementById('notifBtn');
  const notifDropdown = document.getElementById('notifDropdown');
  notifBtn.addEventListener('click', (e)=>{ e.stopPropagation(); notifDropdown.classList.toggle('open'); if(notifDropdown.classList.contains('open')) renderNotifDropdown(); });
  document.addEventListener('click', (e)=>{ if(!e.target.closest('.notif-wrap')) notifDropdown.classList.remove('open'); });

  // Composer. Questions go to the AI backend; the scripted engine remains as an offline fallback that says so plainly
  // instead of inventing an answer — the whole product rests on not doing that.
  const aiInput = document.getElementById('aiInputBox');
  function sendChat(){
    const text = aiInput.value.trim();
    if(!text || state.chatBusy) return;
    aiInput.value = '';
    askBackend(text);
  }
  document.getElementById('aiSendBtn').addEventListener('click', sendChat);
  document.getElementById('chatReset').addEventListener('click', ()=>{ state.chatLog=[]; state.chatFollowupReady=false; renderChatTab(); });
  aiInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); sendChat(); } });

  // Profile chip — a stub; this mock has one seat
  document.getElementById('profileChip').addEventListener('click', ()=> toast('Single-user prototype — account switching isn\'t part of this mock.', { icon: iconInfo() }));

  // Global search / command palette
  const searchScrim = document.getElementById('searchScrim');
  const searchModal = document.getElementById('searchModal');
  const searchInput = document.getElementById('searchInput');
  function openSearch(){ searchScrim.classList.add('open'); searchModal.classList.add('open'); searchInput.value=''; renderSearchResults(''); setTimeout(()=>searchInput.focus(), 50); }
  function closeSearch(){ searchScrim.classList.remove('open'); searchModal.classList.remove('open'); }
  document.getElementById('searchBtn').addEventListener('click', openSearch);
  searchScrim.addEventListener('click', closeSearch);
  searchInput.addEventListener('input', e=> renderSearchResults(e.target.value));
  document.getElementById('searchResults').addEventListener('click', e=>{
    const item = e.target.closest('[data-search-result]');
    if(!item) return;
    closeSearch();
    if(item.dataset.searchResult==='project'){ state.screen = project(item.dataset.id).status==='quoting' ? 'D' : 'B'; if(item.dataset.id!=='PRJ-005') state.selectedProject = item.dataset.id; navigateAndRender(); }
    else if(item.dataset.searchResult==='txn'){ state.screen='B'; state.selectedProject='PRJ-001'; render(); openDrilldown(null, item.dataset.id); }
    else if(item.dataset.searchResult==='screen'){ state.screen = item.dataset.id; navigateAndRender(); }
  });

  document.addEventListener('keydown', (e)=>{
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); if(searchModal.classList.contains('open')) closeSearch(); else openSearch(); return; }
    if(e.key==='Escape'){
      if(searchModal.classList.contains('open')){ closeSearch(); return; }
      if(state.reportOpen){ closeReport(); return; }
      if(state.ddOpen){ closeDrilldown(); return; }
      if(state.alertOpen){ closeAlertDrawer(); return; }
    }
  });
}

loadAppState();
bindStaticEvents();
render();
</script>
