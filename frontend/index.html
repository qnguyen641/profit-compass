  .cause-chip{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--warn-ink); background:var(--warn-bg); border:1px solid var(--warn); border-radius:2px; padding:2px 5px; margin-left:6px; white-space:nowrap; }
  .cause-chip svg{ width:9px; height:9px; }
  .txn-table tr.has-driver{ cursor:pointer; }

  .inc-list{ display:flex; flex-direction:column; gap:6px; }
  .inc-row{ display:grid; grid-template-columns:56px 1fr 90px 14px; align-items:center; gap:13px; width:100%; text-align:left; padding:11px 12px; border:1px solid var(--border); border-left:3px solid var(--warn); border-radius:2px; background:var(--surface); cursor:pointer; }
  .inc-row:hover{ background:var(--surface-2); }
  .inc-row.unexplained{ border-left-color:var(--text-faint); border-style:dashed; cursor:default; opacity:.8; grid-template-columns:56px 1fr 90px; }
  .inc-hrs{ font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-.03em; color:var(--warn); display:flex; flex-direction:column; line-height:1; }
  .inc-row.unexplained .inc-hrs{ color:var(--text-faint); }
  .inc-hrs em{ font-family:var(--font-mono); font-size:8px; font-style:normal; letter-spacing:.11em; text-transform:uppercase; color:var(--text-faint); margin-top:3px; }
  .inc-body{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .inc-title{ font-size:12.5px; font-weight:500; line-height:1.4; }
  .inc-doc{ font-family:var(--font-mono); font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); }
  .inc-track{ position:relative; height:7px; background:var(--surface-3); border-radius:1px; }
  .inc-fill{ position:absolute; left:0; top:0; bottom:0; background:var(--warn); border-radius:1px; }
  .inc-row.unexplained .inc-fill{ background:var(--text-faint); }
  .inc-go{ color:var(--text-faint); display:flex; }
  .inc-go svg{ width:13px; height:13px; }

  .doc-list{ display:flex; flex-direction:column; border:1px solid var(--border); border-radius:2px; overflow:hidden; }
  .doc-row{ display:grid; grid-template-columns:148px 108px 1fr; gap:12px; align-items:baseline; padding:10px 12px; border-top:1px solid var(--border); background:var(--surface); }
  .doc-row:first-child{ border-top:none; }
  .doc-type{ font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); }
  .doc-ref{ font-family:var(--font-mono); font-size:11px; font-weight:600; color:var(--brand); }
  .doc-note{ font-size:11.5px; color:var(--text-muted); line-height:1.5; }
  .ad-vendor{ display:flex; align-items:center; gap:8px; font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-muted); margin:-8px 0 16px; }
  .ad-otsum{ display:flex; align-items:baseline; gap:11px; padding:11px 13px; border:1px solid var(--warn); border-radius:2px; background:var(--warn-bg); }
  .ad-otsum .adi-v{ color:var(--warn-ink); }


  /* ---------- Export report: a document, laid out as one ---------- */
  .report-overlay{ position:fixed; inset:0; z-index:98; background:var(--bg); display:none; flex-direction:column; }
  .report-overlay.open{ display:flex; }
  .report-bar{ display:flex; align-items:center; gap:12px; padding:11px 20px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; }
  .rb-title{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--text-muted); }
  .report-scroll{ flex:1; min-height:0; overflow-y:auto; padding:28px 20px 60px; }
  .rp-sheet{ max-width:980px; margin:0 auto; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:40px 44px 34px; }
  .rp-head{ display:flex; justify-content:space-between; gap:30px; align-items:flex-start; padding-bottom:20px; border-bottom:2px solid var(--text); margin-bottom:26px; flex-wrap:wrap; }
  .rp-eyebrow{ font-family:var(--font-mono); font-size:9px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--brand); margin-bottom:9px; }
  .rp-head h1{ font-size:29px; font-weight:600; margin:0 0 5px; letter-spacing:-.02em; }
  .rp-sub{ font-size:14px; color:var(--text-muted); }
  .rp-meta{ display:grid; grid-template-columns:1fr 1fr; gap:9px 22px; }
  .rp-meta > div{ display:flex; flex-direction:column; gap:2px; }
  .rp-meta span{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--text-faint); }
  .rp-meta b{ font-family:var(--font-mono); font-size:11px; font-weight:600; }
  .rp-sec{ margin-bottom:34px; }
  .rp-sec h2{ font-family:var(--font-mono); font-size:10px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint); margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--border); }
  .rp-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:2px; overflow:hidden; margin-bottom:16px; }
  .rp-stat{ background:var(--surface); padding:11px 14px; display:flex; flex-direction:column; gap:3px; }
  .rp-k{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-faint); }
  .rp-v{ font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }

<script>
/* =========================================================================
   DATA — mirrors QA_Mock_UI_Spec.md §1 (schema) populated from §2 (instances)
   ========================================================================= */

const BOOT_TIME = Date.now();
const PROJECTS = __DATA__.PROJECTS;

// ProfitabilitySnapshot per project (computed fields shown as given; formulas noted per spec)
const SNAPSHOTS = __DATA__.SNAPSHOTS;

const LIFECYCLE_STAGES = ['design','procurement','fabrication','installation','event','dismantling'];

// PRJ-001 budget by category (5 tracked categories; remaining lines outside these make up
// the rest of the contract cost basis, per spec note — the mock keeps the chart to these 5)
const BUDGET_BY_CATEGORY = __DATA__.BUDGET_BY_CATEGORY;
const ACTUAL_BY_CATEGORY = __DATA__.ACTUAL_BY_CATEGORY;
// Open committed POs (RiskAlert #3, SGD 85,000) allocated pro-rata to budget share — feeds the
// forecast column below with a traceable, given number rather than an invented pace formula.
const OPEN_PO_TOTAL = __DATA__.OPEN_PO_TOTAL;
const CATS = ['material','labour','subcontractor','logistics','other'];
const CAT_COLOR = { material:'--cat-material', labour:'--cat-labour', subcontractor:'--cat-subcontractor', logistics:'--cat-logistics', other:'--cat-other' };
function catShareForecast(){
  const budgetSum = CATS.reduce((s,c)=>s+BUDGET_BY_CATEGORY[c],0);
  const out = {};
  CATS.forEach(c=>{ out[c] = ACTUAL_BY_CATEGORY[c] + Math.round(OPEN_PO_TOTAL * (BUDGET_BY_CATEGORY[c]/budgetSum)); });
  return out;
}
const FORECAST_BY_CATEGORY = catShareForecast();

/* ---------------------------------------------------------------------------
   PER-PROJECT CATEGORY DATA
   Every project gets the same analytical treatment — a delivered job is worth
   analysing precisely because it is finished and the lesson is already paid for.
   Each set reconciles to its own ProfitabilitySnapshot: tracked actual + the
   non-itemised remainder equals actual_cost, and tracked budget + remainder
   equals revenue x (1 - budget_margin_pct). Overrun ratios on PRJ-002/003 match
   the REFERENCE_FACTS the Quotation Assistant already cites.
   --------------------------------------------------------------------------- */
const CATEGORY_DATA = __DATA__.CATEGORY_DATA;
const hasAnalytics = pid => !!CATEGORY_DATA[pid];
const budgetOf   = (pid,c) => CATEGORY_DATA[pid].budget[c];
const actualOf   = (pid,c) => CATEGORY_DATA[pid].actual[c];
const budgetTotalCost = pid => Math.round(SNAPSHOTS[pid].revenue * (1 - SNAPSHOTS[pid].budget_margin_pct/100));

// Committed-but-unbilled money still to land. PRJ-001 states it directly (RA-3);
// elsewhere it falls out of the forecast the snapshot already carries.
function openCommitment(pid){
  const itemised = OPEN_COMMITMENTS.filter(c=>c.project_id===pid);
  if(itemised.length) return itemised.reduce((s,r)=>s+r.amount,0);
  const s = SNAPSHOTS[pid];
  if(s.final || s.forecast_final_margin_pct===undefined) return 0;
  return Math.max(0, Math.round(s.revenue*(1 - s.forecast_final_margin_pct/100)) - s.actual_cost);
}
const OPEN_COMMITMENTS = __DATA__.OPEN_COMMITMENTS || [];
function openCommitmentsFor(pid){ return OPEN_COMMITMENTS.filter(c=>c.project_id===pid); }
function forecastOf(pid){
  const actualBase = {};
  const itemised = openCommitmentsFor(pid);
  if(itemised.length){
    // itemised: each commitment lands in its own category — no pro-rata
    const out = {};
    CATS.forEach(c=>out[c]=actualOf(pid,c));
    itemised.forEach(r=>{ out[r.category] += r.amount; });
    return out;
  }
  const commit = openCommitment(pid);
  const budgetSum = CATS.reduce((s,c)=>s+budgetOf(pid,c),0);
  // largest-remainder rounding: the allocation sums EXACTLY to the commitment
  const rows = CATS.map(c=>{ const x = commit * (budgetOf(pid,c)/budgetSum); return { c, v: Math.floor(x), rem: x - Math.floor(x) }; });
  let left = Math.round(commit - rows.reduce((s,r)=>s+r.v,0));
  rows.slice().sort((a,b)=>b.rem-a.rem).forEach(r=>{ if(left>0){ r.v++; left--; } });
  const out = {};
  rows.forEach(r=>{ out[r.c] = actualOf(pid,r.c) + r.v; });
  return out;
}

// One authored line per driver. Kept to a single sentence: the numbers are on
// screen already, so the note only has to say what they mean.
const DRIVER_NOTES = __DATA__.DRIVER_NOTES;

// The retrospective verdict on a delivered job — the sentence the next quote needs.
const PROJECT_LESSON = __DATA__.PROJECT_LESSON;

// CostTransaction rows for PRJ-001 (§2: named PO-2381 + untagged inherit/suggest/distribute rows)
// amount fields sum exactly to ACTUAL_BY_CATEGORY per category.
const TRANSACTIONS = __DATA__.TRANSACTIONS;

// LabourEntry summary — installation-crew subset (10 craftsmen)


const crewHours = e => e.normal + e.ot;
const crewCost  = e => crewHours(e) * LABOUR_SUMMARY.hourly_rate;
const crewOtPct = e => Math.round(e.ot / crewHours(e) * 100);

// Total budgeted cost implied by the snapshot: revenue x (1 - budgeted margin).
// Used for the burn-vs-progress instrument; derived, never hand-typed.
const BUDGET_TOTAL_COST = Math.round(SNAPSHOTS['PRJ-001'].revenue * (1 - SNAPSHOTS['PRJ-001'].budget_margin_pct/100));

// Spend by lifecycle phase, summed live from the transaction rows.
function spendByPhase(){
  const out = {};
  LIFECYCLE_STAGES.forEach(p=>out[p]=0);
  TRANSACTIONS.filter(t=>t.project_id==='PRJ-001'||t.resolved_project_id==='PRJ-001')
    .forEach(t=>{ out[t.phase] = (out[t.phase]||0) + t.amount; });
  return out;
}
const SPEND_BY_PHASE = spendByPhase();

// Every distinct vendor in a category, with what they were paid and for what.
function vendorBreakdown(cat, pid='PRJ-001'){
  const rows = TRANSACTIONS.filter(t=>(t.project_id===pid||t.resolved_project_id===pid) && (!cat || t.category===cat));
  const map = new Map();
  rows.forEach(t=>{
    const v = map.get(t.vendor) || { vendor:t.vendor, total:0, count:0, items:[], unresolved:false };
    v.total += t.amount; v.count++; v.items.push(t);
    if(t.project_id===null) v.unresolved = true;
    map.set(t.vendor, v);
  });
  const all = [...map.values()].sort((a,b)=>b.total-a.total);
  const sum = all.reduce((s,v)=>s+v.total,0);
  all.forEach(v=>v.share = sum ? v.total/sum*100 : 0);
  return all;
}

/* ---------------------------------------------------------------------------
   MARGIN BRIDGE — the "where is profit leaking" model.
   Runs from budgeted tracked cost to forecast tracked cost, one step per
   category variance plus the open PO commitment. Every step is a subtraction
   already defined above; the bridge invents nothing.
   --------------------------------------------------------------------------- */
function buildBridge(pid){
  const from = CATS.reduce((s,c)=>s+budgetOf(pid,c),0);
  const fc = forecastOf(pid);
  const commit = openCommitment(pid);
  const steps = CATS.map(c=>({
    key:c, label:catLabel(c), cat:c,
    impact: -(actualOf(pid,c) - budgetOf(pid,c)),   // cost over budget is negative for margin
  })).sort((a,b)=>a.impact-b.impact);
  if(commit>0) steps.push({ key:'open_po', label:'Committed, not yet billed', cat:null, impact:-commit });
  const to = CATS.reduce((s,c)=>s+fc[c],0);
  return { from, to, steps, commit, net: steps.reduce((s,x)=>s+x.impact,0) };
}

/* AI DIAGNOSIS — the analyst's verdict, computed from the bridge. */
function buildDiagnosis(pid){
  const snap = SNAPSHOTS[pid], p = project(pid);
  const b = buildBridge(pid);
  const leaks = b.steps.filter(s=>s.impact<0).sort((a,b2)=>a.impact-b2.impact);
  const gains = b.steps.filter(s=>s.impact>0).sort((a,b2)=>b2.impact-a.impact);
  // The verdict names the biggest *category* leak. A commitment still to land is
  // not a category that overspent, so it is called out separately rather than
  // being allowed to win the "largest driver" ranking.
  const worst = leaks.find(s=>s.cat) || leaks[0];
  const best  = gains.find(s=>s.cat);
  const budgetCost = budgetTotalCost(pid);
  const burnPct = Math.round(snap.actual_cost / budgetCost * 100);
  const donePct = p.completion_pct==null ? 0 : p.completion_pct;
  const finalPct = snap.final ? snap.margin_pct : snap.forecast_final_margin_pct;
  const marginDrop = +(snap.budget_margin_pct - finalPct).toFixed(1);

  let verdict;
  if(snap.final){
    verdict = worst
      ? `Closed at ${pct(snap.margin_pct)} against a ${pct(snap.budget_margin_pct)} plan — ${marginDrop} points given away. <b>${worst.label}</b> was the largest single leak at ${fmtSGD(worst.impact)}.`
      : `Closed at ${pct(snap.margin_pct)}, on or ahead of its ${pct(snap.budget_margin_pct)} plan.`;
  } else if(!worst){
    verdict = `Every tracked category is at or under budget. Forecast margin ${pct(finalPct)} against a ${pct(snap.budget_margin_pct)} plan.`;
  } else {
    const fcCost = snap.forecast_final_cost != null ? snap.forecast_final_cost
      : (snap.forecast_final_margin_pct != null ? Math.round(snap.revenue*(1-snap.forecast_final_margin_pct/100)) : null);
    const fBurn = fcCost ? Math.round(snap.actual_cost/fcCost*100) : null;
    const highAlert = RISK_ALERTS.some(r=>r.project_id===pid && r.status==='open' && r.severity==='high');
    if(burnPct - donePct > 25 && marginDrop <= 2.5 && !highAlert){
      verdict = `Front-loaded, not overrun: ${fBurn??burnPct}% of the forecast final cost is already committed at ${donePct}% delivered — this job buys its materials and subcontracts up front. Forecast margin ${pct(finalPct)} against a ${pct(snap.budget_margin_pct)} plan${worst?`; <b>${worst.label}</b> is the only tracked pressure at ${fmtSGD(worst.impact)}`:''}.`;
    } else {
      verdict = `<b>${worst.label}</b> is the largest leak at ${fmtSGD(worst.impact)}`
        + (b.commit>0 ? `, and a further ${fmtSGD(b.commit)} is committed but not yet billed` : '')
        + `. Budget is ${burnPct}% spent against ${donePct}% delivered.`;
    }
  }
  return { pid, bridge:b, leaks, gains, worst, best, burnPct, donePct, marginDrop, finalPct,
           gap: burnPct - donePct, isFinal: !!snap.final, verdict };
}

          <div class="ih-cat">${catLabel(ins.category)} · ${ins.deltaPct>0?'+':''}${ins.deltaPct}%</div>

        </div>
        <div class="ih-impact ${impactCls}">

          <div class="sub">margin</div>
        </div>
        <span class="ih-chev">${iconChevron()}</span>
      </div>
      <div class="insight-detail"><div class="insight-detail-inner">
        <div class="synth-block synth-computed">
          <div class="synth-lbl">Computed</div>
          <code>Δ = ${fmtSGD(ins.actual)} − ${fmtSGD(ins.budget)} = ${ins.deltaAmt>=0?'+':'−'}${fmtSGD(Math.abs(ins.deltaAmt))} (${ins.deltaPct>0?'+':''}${ins.deltaPct}%)</code>
        </div>

}

/* ---------- Screen B: Profitability Dashboard ---------- */
function renderScreenB(pid){
  const p = project(pid);
  if(p.status==='quoting'){ state.screen='D'; return renderScreenD(); }
  const snap = snapshot(pid);
  const isFinal = !!snap.final;
  const marginTone = snap.margin_pct >= snap.budget_margin_pct ? 'tone-good' : 'tone-critical';
  const fcst = isFinal ? snap.margin_pct : snap.forecast_final_margin_pct;
  const fcstTone = fcst >= snap.budget_margin_pct ? 'tone-good' : 'tone-critical';
  const txnCount = TRANSACTIONS.filter(t=>t.project_id===pid||t.resolved_project_id===pid).length;

  const kpis = `
    <div class="kpi-strip" style="margin-bottom:16px">
      <div class="kpi"><div class="lbl">Revenue</div><div class="val num">${fmtSGD(snap.revenue)}</div><div class="sub">contract_value</div></div>
      <div class="kpi"><div class="lbl">${isFinal?'Final cost':'Actual cost'}</div><div class="val num">${fmtSGD(snap.actual_cost)}</div><div class="sub">plan ${fmtSGD(budgetTotalCost(pid))} · ${txnCount?txnCount+' txns + payroll':'ledger'}</div></div>
      <div class="kpi"><div class="lbl">Profit</div><div class="val num">${fmtSGD(snap.profit)}</div><div class="sub">plan ${fmtSGD(snap.revenue - budgetTotalCost(pid))} · revenue − cost</div></div>
      <div class="kpi ${marginTone}"><div class="lbl">${isFinal?'Final margin':'Margin'}</div><div class="val num">${pct(snap.margin_pct)}</div><div class="sub">plan ${pct(snap.budget_margin_pct)}</div></div>
      <div class="kpi ${fcstTone}"><div class="lbl">${isFinal?'vs plan':'Forecast margin'}</div><div class="val num">${isFinal?(snap.margin_pct-snap.budget_margin_pct>0?'+':'')+(snap.margin_pct-snap.budget_margin_pct).toFixed(1)+' pts':pct(fcst)}</div><div class="sub">${isFinal?'at close':'incl. commitments'}</div></div>
    </div>`;

  if(!hasAnalytics(pid)){
    return kpis + `<div class="card pad" style="max-width:620px">
      <div class="section-label">Category detail</div>

    </div>`;
  }

  return kpis
    + renderDiagnosis(pid)
    + renderProgressPanel(pid)
    + renderVarianceTable(pid)
    + renderInsightCards(pid)
    + `<div style="display:flex;gap:10px;margin-top:18px">
         ${txnCount?`<button class="btn primary" id="viewAllTxnsBtn">${iconFile()} All transactions</button>`:''}
         <button class="btn ghost" id="exportBtn">${iconDownload()} Spend report</button>
       </div>`;
}

/* =========================================================================
   ANALYTICS BAND — one unit that both runs the analysis and carries everything
   the risk alerts were saying. Alerts are project data, so they live on the
   sheet next to the numbers that raised them, not in a side column.
   ========================================================================= */
function analysisSteps(pid){
  const d = buildDiagnosis(pid);
  const txns = TRANSACTIONS.filter(t=>t.project_id===pid||t.resolved_project_id===pid);
  const trackedActual = CATS.reduce((s,c)=>s+actualOf(pid,c),0);
  return [
    { t:'Reading cost ledger', src:'SAP Business One',
      r: txns.length ? `${txns.length} transactions · ${fmtSGD(trackedActual)}` : `${fmtSGD(SNAPSHOTS[pid].actual_cost)} posted` },
    { t:'Reconciling labour hours', src:'Time & Attendance',
      r: pid==='PRJ-001' ? `${LABOUR_SUMMARY.craftsmen} crew · ${LABOUR_SUMMARY.total_hours.toLocaleString()} h · ${LABOUR_SUMMARY.overtime_hours} OT` : `${fmtSGD(actualOf(pid,'labour'))} payroll posted` },
    { t:'Comparing actuals against plan', src:`${CATS.length} categories`,
      r: `${d.leaks.filter(s=>s.cat).length} over, ${d.gains.length} under` },
    { t:'Pricing committed but unbilled work', src:'open purchase orders',
      r: d.bridge.commit>0 ? `${fmtSGD(d.bridge.commit)} still to land` : 'nothing outstanding' },
    { t:'Ranking drivers by margin impact', src:'variance model',
      r: d.worst ? `${d.worst.label} leads at ${fmtSGD(d.worst.impact)}` : 'no negative drivers' },
    { t:'Checking risk thresholds', src:'alert rules',
      r: (()=>{ const n = RISK_ALERTS.filter(r=>r.project_id===pid).length; return n ? `${n} raised` : 'none breached'; })() },
  ];
}

function renderDiagnosis(pid){
  const d = buildDiagnosis(pid);
  const done = state.analysisPlayed===pid;
  const steps = analysisSteps(pid).map((s,i)=>
    `<li class="an-step${done?' done':''}" data-an-step="${i}">
       <span class="an-tick">${iconCheck()}</span>
       <span class="an-t">${s.t}<em>${s.src}</em></span>
       <span class="an-r">${s.r}</span>
     </li>`).join('');
  const alerts = RISK_ALERTS.filter(r=>r.project_id===pid);
  const openAlerts = alerts.filter(r=>!state.ackStatus[r.id]);

  const attention = alerts.length ? `
    <div class="attention">
      <div class="att-head">
        <span class="att-k">${openAlerts.length?`${openAlerts.length} open ${openAlerts.length===1?'issue':'issues'}`:'All issues reviewed'}</span>
        <span class="att-sub">threshold checks that fired on the figures above</span>
      </div>
      <div class="att-list">
        ${alerts.map(r=>`<button class="att-item ${r.severity} ${state.ackStatus[r.id]?'acked':''}" data-alert-open="${r.id}">
          <span class="att-sev">${r.severity}</span>
          <span class="att-what">${r.what_happened}</span>
          <span class="att-imp">${r.expected_impact_sgd!=null?fmtSGD(r.expected_impact_sgd):r.impact_note}</span>
          <span class="att-go">${iconChevron()}</span>
        </button>`).join('')}
      </div>
    </div>` : '';

  return `
    <section class="diagnosis${done?' revealed':''}" id="diagnosis" data-pid="${pid}">
      <header class="dg-head">
        <span class="section-label" style="margin:0;flex:1">${aiMark()} ${d.isFinal?'Retrospective':'Profit diagnosis'}</span>
        <button class="btn ghost sm" id="rerunAnalysis">${iconCompass('currentColor')} Re-run</button>
      </header>
      <ol class="an-steps" id="anSteps">${steps}</ol>
      <div class="dg-body">
        <div class="dg-verdict">
          ${d.isFinal
            ? `<div class="dg-gauge ${d.marginDrop>0?'over':'under'}"><span class="dg-gap">${d.marginDrop>0?'−':'+'}${Math.abs(d.marginDrop)}</span><span class="dg-gap-lbl">pts vs<br/>plan</span></div>`
            : `<div class="dg-gauge ${d.gap>0?'over':'under'}" title="Budget ${d.burnPct}% spent − ${d.donePct}% delivered = ${d.gap>0?'+':''}${d.gap} points"><span class="dg-gap">${d.gap>0?'+':''}${d.gap}</span><span class="dg-gap-lbl">pt burn<br/>gap</span><span class="mono" style="font-size:8.5px;color:var(--text-faint);margin-top:2px">${d.burnPct}%−${d.donePct}%</span></div>`}
          <p>${d.verdict}</p>
        </div>
        ${renderBridge(d.bridge, pid)}
        ${attention}
        ${PROJECT_LESSON[pid] ? `<div class="lesson">${aiMark()}<div><span class="ls-k">${d.isFinal?'Retrospective':'Read'}</span>${PROJECT_LESSON[pid]}</div></div>` : ''}
      </div>
    </section>`;
}

function renderBridge(b, pid){
  const span = Math.max(...b.steps.map(s=>Math.abs(s.impact)), 1);
  const tieSnap = SNAPSHOTS[pid];
  const tiePlanTotal = budgetTotalCost(pid);
  const tiePlanOH = tiePlanTotal - b.from;
  const tieRightTotal = tieSnap.final ? tieSnap.actual_cost
    : (tieSnap.forecast_final_cost != null ? tieSnap.forecast_final_cost
       : b.to + (tieSnap.actual_cost - CATS.reduce((s,c)=>s+actualOf(pid,c),0)));
  const tieRightOH = tieRightTotal - b.to;
  const alertByCat = {};
  RISK_ALERTS.filter(r=>r.project_id===pid && r.category).forEach(r=>alertByCat[r.category]=r);
  const rows = b.steps.map(s=>{
    const neg = s.impact < 0;
    const w = Math.abs(s.impact)/span*100;
    const col = s.cat ? catColorVar(s.cat) : 'var(--text-faint)';
    const al = s.cat ? alertByCat[s.cat] : null;
    return `<div class="br-row${(s.cat||s.key==='open_po')?' clickable':''}" ${s.cat?`data-drill-category="${s.cat}"`:''}${s.key==='open_po'?` data-open-commitments="${pid}" title="Inspect the open commitments"`:''}>
      <span class="br-lbl"><span class="cat-tick" style="background:${col}"></span>${s.label}${al?`<span class="br-flag ${al.severity}" title="${al.what_happened}">!</span>`:''}</span>
      <span class="br-plot">
        <span class="br-axis"></span>
        <span class="br-bar ${neg?'neg':'pos'}" style="width:${(w/2).toFixed(1)}%;background:${neg?'var(--critical)':'var(--good)'}"></span>
      </span>
      <span class="br-val ${neg?'neg':'pos'}">${s.impact>=0?'+':'−'}${fmtSGD(Math.abs(s.impact)).replace('−','')}</span>
    </div>`;
  }).join('');
  return `
    <div class="bridge">
      <div class="br-ends">
        <span><b class="num">${fmtSGD(b.from)}</b><em>planned, ${CATS.length} tracked categories</em><em style="display:block;margin-top:1px;color:var(--text-faint)">+ ${fmtSGD(tiePlanOH)} overheads = ${fmtSGD(tiePlanTotal)} total plan</em></span>
        <span class="br-arrow">${iconArrow()}</span>
        <span class="ra"><b class="num">${fmtSGD(b.to)}</b><em>${SNAPSHOTS[pid].final?'final':'forecast'}, ${CATS.length} tracked categories</em><em style="display:block;margin-top:1px;color:var(--text-faint)">+ ${fmtSGD(tieRightOH)} overheads = ${fmtSGD(tieRightTotal)} ${SNAPSHOTS[pid].final?'final cost':'forecast final cost'}</em></span>
      </div>
      ${rows}
    </div>`;
}

/* ---------- Progress: delivery against burn, then spend by phase ---------- */
function renderProgressPanel(pid){
  const d = buildDiagnosis(pid);
  const p = project(pid), snap = snapshot(pid);
  const budgetCost = budgetTotalCost(pid);
  let phaseBlock = '';
  const phaseSpend = (()=>{ const o={}; LIFECYCLE_STAGES.forEach(x=>o[x]=0);
    TRANSACTIONS.filter(t=>t.project_id===pid||t.resolved_project_id===pid)
      .forEach(t=>{ o[t.phase]=(o[t.phase]||0)+t.amount; }); return o; })();
  if(LIFECYCLE_STAGES.some(x=>phaseSpend[x]>0)){
    const phases = LIFECYCLE_STAGES;
    const maxPhase = Math.max(...phases.map(ph=>phaseSpend[ph]||0));
    const curIdx = d.isFinal ? phases.length : phases.indexOf(p.lifecycle_stage);
    phaseBlock = `
      <div class="phase-strip">${phases.map((ph,i)=>{
        const amt = phaseSpend[ph]||0;
        const h = maxPhase ? Math.max(3, amt/maxPhase*100) : 3;
        const cls = i<curIdx ? 'past' : i===curIdx ? 'current' : 'future';
        return `<div class="ph-col ${cls}" title="${catLabel(ph)} — ${fmtSGD(amt)}">
          <span class="ph-bar-wrap"><span class="ph-bar" style="height:${h}%"></span></span>
          <span class="ph-amt num">${amt?fmtSGD(amt).replace('S$',''):'—'}</span>
          <span class="ph-name">${ph}</span>
        </div>`;
      }).join('')}</div>
      <div class="phase-legend">${d.isFinal?'All phases delivered · bar height = spend recorded in that phase':'<span class="pl-cur"></span>Current phase · bar height = spend recorded in that phase'}</div>`;
  }

  const note = d.isFinal
    ? `Closed at ${fmtSGD(snap.actual_cost)} against ${fmtSGD(budgetCost)} planned — ${fmtSGD(snap.actual_cost-budgetCost)} over.`
    : (()=>{ const fcCost = snap.forecast_final_cost != null ? snap.forecast_final_cost
        : (snap.forecast_final_margin_pct != null ? Math.round(snap.revenue*(1-snap.forecast_final_margin_pct/100)) : null);
      const fb = fcCost ? Math.round(snap.actual_cost/fcCost*100) : null;
      return `${fmtSGD(snap.actual_cost)} of ${fmtSGD(budgetCost)} planned cost is committed with ${100-d.donePct}% of the job still to deliver`
        + (fcCost ? ` — and ${fb}% of the ${fmtSGD(fcCost)} forecast final cost.` : '.'); })();

  return `
    <div class="card pad" style="margin-bottom:16px">
      <div class="section-label">${d.isFinal?'Delivered against plan':'Progress against burn'}</div>
      <div style="display:flex;gap:3px;margin-bottom:14px">${LIFECYCLE_STAGES.map((ph,i)=>{
        const cur = d.isFinal ? LIFECYCLE_STAGES.length : LIFECYCLE_STAGES.indexOf(p.lifecycle_stage);
        const st = i<cur ? 'past' : i===cur ? 'current' : 'future';
        const bar = st==='past' ? 'background:var(--brand);opacity:.35' : st==='current' ? 'background:var(--brand)' : 'background:var(--surface-2);border:1px solid var(--border)';
        const lbl = st==='current' ? 'color:var(--brand-ink);font-weight:700' : st==='past' ? 'color:var(--text-muted)' : 'color:var(--text-faint)';
        return `<div style="flex:1;min-width:0" title="${catLabel(ph)}${st==='current'?' — current stage':st==='past'?' — done':''}">
          <div style="height:6px;border-radius:2px;${bar}"></div>
          <div class="mono" style="font-size:8.5px;letter-spacing:.04em;text-transform:uppercase;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;${lbl}">${ph}</div>
        </div>`;
      }).join('')}</div>
      <div class="burn">
        <div class="burn-row">
          <span class="burn-k">Delivered</span>
          <span class="burn-track"><span class="burn-fill done" style="width:${d.donePct}%"></span></span>
          <span class="burn-v num">${d.donePct}%</span>
        </div>
        <div class="burn-row">
          <span class="burn-k">Planned cost spent</span>
          <span class="burn-track"><span class="burn-fill ${d.burnPct>d.donePct?'over':'ok'}" style="width:${Math.min(100,d.burnPct)}%"></span><span class="burn-mark" style="left:${Math.min(100,d.donePct)}%"></span></span>
          <span class="burn-v num ${d.burnPct>d.donePct?'bad':''}">${d.burnPct}%</span>
        </div>
      </div>
      <p class="burn-note">${note}</p>
      ${phaseBlock}
    </div>`;
}

/* ---------- One consolidated variance table ---------- */
function renderVarianceTable(pid){
  const fc = forecastOf(pid), isFinal = !!SNAPSHOTS[pid].final;
  const maxAbs = Math.max(...CATS.map(c=>Math.abs(actualOf(pid,c)-budgetOf(pid,c))), 1);
  const drillable = hasAnalytics(pid);
  const rows = CATS.map(c=>{
    const bud = budgetOf(pid,c), act = actualOf(pid,c);
    const delta = act - bud, dPct = Math.round(delta/bud*100), over = delta > 0;
    const w = Math.abs(delta)/maxAbs*50;
    return `<tr class="var-row${drillable?'':' flat'}" ${drillable?`data-drill-category="${c}"`:''}>
      <td><span class="cat-tick" style="background:${catColorVar(c)}"></span>${catLabel(c)}</td>
      <td class="ta-r num">${fmtSGD(bud)}</td>
      <td class="ta-r num"><b>${fmtSGD(act)}</b></td>
      <td class="ta-r num muted">${isFinal?'—':fmtSGD(fc[c])}</td>
      <td class="var-plot"><span class="vp-axis"></span><span class="vp-bar ${over?'over':'under'}" style="width:${w.toFixed(1)}%"></span></td>
      <td class="ta-r"><span class="delta-chip ${over?'over':'under'}">${over?'+':''}${dPct}%</span></td>
      <td class="ta-r">${drillable?`<span class="row-go">${iconChevron()}</span>`:''}</td>
    </tr>`;
  }).join('');
  const sums = CATS.reduce((a,c)=>({b:a.b+budgetOf(pid,c), a:a.a+actualOf(pid,c), f:a.f+fc[c]}),{b:0,a:0,f:0});
  return `
    <div class="card" style="margin-bottom:16px;overflow:hidden">
      <div class="pad" style="padding-bottom:4px"><div class="section-label" style="margin-bottom:2px">Spend by category</div></div>
      <div class="txn-scroll" style="margin:0;padding:0">
      <table class="var-table">
        <thead><tr>
          <th>Category</th><th class="ta-r">Plan</th><th class="ta-r">${isFinal?'Final':'Actual'}</th><th class="ta-r">Forecast</th>
          <th style="width:150px">Variance</th><th class="ta-r">Δ</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr>
          <td>Tracked total</td>
          <td class="ta-r num">${fmtSGD(sums.b)}</td>
          <td class="ta-r num"><b>${fmtSGD(sums.a)}</b></td>
          <td class="ta-r num">${isFinal?'—':fmtSGD(sums.f)}</td>
          <td colspan="3" class="ta-r muted" style="font-size:11px">of ${fmtSGD(SNAPSHOTS[pid].actual_cost)} total</td>
        </tr></tfoot>
      </table>
      </div>
    </div>`;
}

/* ---------- Screen D: Quotation Assistant ---------- */
let quoteMarginPct = QUOTE_REQUEST.target_margin_pct_default;
let quoteRunning = false;
const QUOTE_DRAFTS = (__DATA__.QUOTE_DRAFTS || []);
const MARGIN_ANCHORS = [
  { m:30, note:'the plan on both reference jobs — neither delivered it' },
  { m:28, note:'the reference failure patterns are already priced into the cost as contingency', rec:true },
  { m:26, note:'best margin actually delivered (Gardens by the Bay Festive 2025)' },
  { m:24, note:'worst delivered (Orchard Road Christmas 2025)' },
];
function quotePrice(m){ return Math.round(costBaseForMargin()/(1-m/100)); }
function renderMarginLadder(){
  const base = costBaseForMargin();
  const anchors = MARGIN_ANCHORS.map(a=>{
    const price = quotePrice(a.m);
    const sel = Math.abs(quoteMarginPct-a.m)<0.001;
    return `<button class="ml-row" data-margin="${a.m}" style="display:grid;grid-template-columns:56px 1fr;gap:2px 12px;width:100%;text-align:left;padding:8px 10px;border:1px solid ${sel?'var(--brand)':'var(--border)'};background:${sel?'var(--brand-bg)':'var(--surface)'};border-radius:3px;cursor:pointer;margin-bottom:6px;font-family:inherit;color:inherit">
      <span class="num" style="font-weight:700;font-size:15px;${sel?'color:var(--brand-ink)':''}">${a.m}%</span>
      <span style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><span class="num" style="font-weight:600;font-size:13px">${fmtSGD(price)}</span><span class="num" style="font-size:11px;color:var(--text-muted)">profit ${fmtSGD(price-base)}</span></span>
      <span></span><span style="font-size:10.5px;color:var(--text-muted)">${a.note}${a.rec?' · <b>recommended</b>':''}</span>
    </button>`;
  }).join('');
  const isCustom = !MARGIN_ANCHORS.some(a=>Math.abs(a.m-quoteMarginPct)<0.001);
  return anchors + `<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px dashed ${isCustom?'var(--brand)':'var(--border)'};border-radius:3px;${isCustom?'background:var(--brand-bg);':''}">
      <span class="mono" style="font-size:9px;letter-spacing:.08em;color:var(--text-faint)">CUSTOM</span>
      <input type="number" id="customMarginInput" min="5" max="60" step="0.5" value="${isCustom?quoteMarginPct:''}" placeholder="—" style="width:64px;padding:4px 6px;border:1px solid var(--border);border-radius:2px;background:var(--surface);color:var(--text);font-family:var(--font-mono);font-size:12px;text-align:right"/>
      <span style="font-size:11px;color:var(--text-muted)">%</span>
      <span class="num" id="customMarginOut" style="font-size:11.5px;margin-left:auto">${isCustom?fmtSGD(quotePrice(quoteMarginPct)):''}</span>
    </div>`;
}
function costBaseForMargin(){ return CATS.reduce((s,c)=>s+QUOTE_REQUEST.suggested_budget_by_category[c],0); }
function suggestedContractValue(marginPct){ return costBaseForMargin()/(1-marginPct/100); }

/* The comparable search, scored per candidate. The scoring is shown, not hidden,
   because the whole claim of the screen is "this price came from your own history". */
function scoreCandidates(){
  return PROJECTS.filter(p=>p.id!=='PRJ-005' && SNAPSHOTS[p.id]).map(p=>{
    const s = SNAPSHOTS[p.id];
    const sameType = p.type === QUOTE_REQUEST.project_type;
    const sameClient = p.customer === QUOTE_REQUEST.customer;
    const delivered = !!s.final;
    const reasons = [], against = [];
    if(sameType) reasons.push('same project type'); else against.push('different project type');
    if(sameClient) reasons.push('same client');
    if(delivered) reasons.push('delivered — final costs on file'); else against.push('still in progress, no final costs');
    const matched = QUOTE_REQUEST.reference_project_ids.includes(p.id);
    return { p, snap:s, sameType, sameClient, delivered, matched, reasons, against,
             score: (sameType?60:0) + (sameClient?20:0) + (delivered?20:0) };
  }).sort((a,b)=>b.score-a.score);
}


/* Cost-base build-up — each suggested category amount decomposed into the
   payees behind it: mean of the two reference jobs' actuals scaled to the
   base budget, plus an explicit, reasoned contingency line. */
function renderQuoteBuildup(){
  if(!QUOTE_REQUEST.build_up) return '';
  return CATS.map(c=>{
    const lines = QUOTE_REQUEST.build_up[c]||[];
    const tot = QUOTE_REQUEST.suggested_budget_by_category[c];

/* The search run. Each candidate is examined in turn so you can see the shortlist
   being formed, rather than a shortlist simply appearing. */
let searchTimers = [];
function playQuoteSearch(){
  const wrap = document.getElementById('qsearch');
  if(!wrap) return;
  searchTimers.forEach(clearTimeout); searchTimers = [];
  const rows = [...wrap.querySelectorAll('.sc-row')];
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ state.quoteSearched = true; quoteRunning = false; render(); return; }
  wrap.classList.remove('revealed');
  rows.forEach(r=>r.classList.remove('done','active'));
  const RUN = 780;
  rows.forEach((r,i)=>{
    searchTimers.push(setTimeout(()=>r.classList.add('active'), i*RUN));
    searchTimers.push(setTimeout(()=>{ r.classList.remove('active'); r.classList.add('done'); }, i*RUN + 480));
  });
  searchTimers.push(setTimeout(()=>{ state.quoteSearched = true; quoteRunning = false; render(); }, rows.length*RUN + 340));
}

/* ---------- Drill-down (Screen C) ---------- */
function txnAverage(cat, pid){
  const rows = TRANSACTIONS.filter(t=>t.category===cat && (t.project_id===pid||t.resolved_project_id===pid));
  return rows.length ? rows.reduce((s,t)=>s+t.amount,0)/rows.length : 0;
}
function isFlagged(t){
  if(t.driver) return true;
  if(t.quoted_amount){ return (t.amount-t.quoted_amount)/t.quoted_amount > 0.15; }
  return false;
}
function openDrilldown(category, highlightId, pid){
  state.ddOpen = true; state.ddCategory = category; state.ddHighlightId = highlightId || null;
  state.ddProject = pid || (state.screen==='B' ? state.selectedProject : 'PRJ-001');
  document.getElementById('ddScrim').classList.add('open');
  document.getElementById('drilldown').classList.add('open');
  renderDrilldown();
}
function closeDrilldown(){
  state.ddOpen = false;
  document.getElementById('ddScrim').classList.remove('open');
  document.getElementById('drilldown').classList.remove('open');
}
function renderDrilldown(){
  const pid = state.ddProject || 'PRJ-001';
  const cat = state.ddCategory;
  const p = project(pid);
  document.getElementById('ddCrumb').innerHTML = `${p.name} &rsaquo; <b>${cat?catLabel(cat):'All categories'}</b>`;

  let rows = TRANSACTIONS.filter(t=>t.project_id===pid || t.resolved_project_id===pid);
  if(cat) rows = rows.filter(t=>t.category===cat);
  if(state.ddFlaggedOnly) rows = rows.filter(t=>isFlagged(t) || t.driver);
  rows = rows.slice();
  if(state.ddSort){
    const { key, dir } = state.ddSort, mul = dir==='asc' ? 1 : -1;
    rows.sort((a,b)=> key==='amount' ? (a.amount-b.amount)*mul : String(a[key]).localeCompare(String(b[key]))*mul);
  } else {
    rows.sort((a,b)=> (b.tag_status==='unallocated')-(a.tag_status==='unallocated') || (!!b.driver)-(!!a.driver) || b.amount-a.amount);
  }

  const flaggedCount = TRANSACTIONS.filter(t=>(t.project_id===pid||t.resolved_project_id===pid) && (!cat||t.category===cat) && (isFlagged(t)||t.driver)).length;
  const sortArrow = key => (!state.ddSort || state.ddSort.key!==key)
    ? '<span class="sort-arrow">↕</span>' : `<span class="sort-arrow">${state.ddSort.dir==='asc'?'↑':'↓'}</span>`;
  const sortCls = key => (state.ddSort && state.ddSort.key===key) ? 'sortable sort-active' : 'sortable';

  /* ---- what this category cost against plan ---- */
  let summary = '';
  if(cat){
    const bud = budgetOf(pid,cat), act = actualOf(pid,cat), fc = forecastOf(pid)[cat];
    const delta = act-bud, dPct = Math.round(delta/bud*100), over = delta>0;
    summary = `<div class="dd-summary" style="--accent:${catColorVar(cat)}">
      <div class="dds-stat"><span class="dds-k">Plan</span><span class="dds-v num">${fmtSGD(bud)}</span></div>
      <div class="dds-stat"><span class="dds-k">${SNAPSHOTS[pid].final?'Final':'Actual'}</span><span class="dds-v num strong">${fmtSGD(act)}</span></div>
      <div class="dds-stat"><span class="dds-k">Forecast</span><span class="dds-v num">${SNAPSHOTS[pid].final?'—':fmtSGD(fc)}</span></div>
      <div class="dds-stat"><span class="dds-k">Variance</span><span class="dds-v num ${over?'bad':'good'}">${over?'+':''}${fmtSGD(delta)} · ${over?'+':''}${dPct}%</span></div>
    </div>`;
  }

  /* ---- WHERE THE EXTRA WENT: every line with a named cause ---- */
  const driven = TRANSACTIONS.filter(t=>(t.project_id===pid||t.resolved_project_id===pid) && (!cat||t.category===cat) && t.driver);
  const causeGroups = {};
  driven.forEach(t=>{ (causeGroups[t.driver.cause] = causeGroups[t.driver.cause] || []).push(t); });
  const driverBlock = driven.length ? `
    <section class="dd-sec">
      <div class="section-label">What we paid extra for — ${driven.length} ${driven.length===1?'line':'lines'} with a named cause</div>
      <div class="cause-list">
        ${Object.entries(causeGroups).map(([cause,ts])=>{
          const total = ts.reduce((s,t)=>s+t.amount,0);
          const overQ = ts.reduce((s,t)=>s + (t.quoted_amount ? t.amount-t.quoted_amount : 0), 0);
          return `<div class="cause-group">
            <div class="cause-head">
              <span class="cause-name">${CAUSE_LABEL[cause]||cause}</span>
              <span class="cause-meta">${ts.length} ${ts.length===1?'line':'lines'} · ${fmtSGD(total)}${overQ?` · ${fmtSGD(overQ)} above ${cause==='estimate_not_quote'?'estimate':'quote'}`:''}</span>
            </div>
            ${ts.map(t=>`<button class="cause-row" data-driver="${t.id}">
              <span class="cr-id">${t.id}</span>
              <span class="cr-desc"><b>${t.vendor}</b><em>${t.driver.note.split('.')[0]}.</em></span>
              ${t.driver.incident?`<span class="cr-inc">${t.driver.incident}</span>`:''}
              <span class="cr-amt num">${fmtSGD(t.amount)}</span>
              <span class="cr-go">${iconChevron()}</span>
            </button>`).join('')}
          </div>`;
        }).join('')}
      </div>
    </section>` : '';

  /* ---- who was paid ---- */
  const vendors = vendorBreakdown(cat, pid);
  const vMax = Math.max(...vendors.map(v=>v.total), 1);
  const vendorBlock = vendors.length ? `
    <section class="dd-sec">
      <div class="section-label">Paid to — ${vendors.length} ${cat==='labour'?'internal crews':'vendors'}</div>
      <div class="vendor-list">
        ${vendors.map(v=>`
          <div class="vendor-row">
            <span class="v-name">${v.vendor}${v.unresolved?' <span class="tag-badge unallocated">inferred</span>':''}</span>
            <span class="v-track"><span class="v-bar" style="width:${(v.total/vMax*100).toFixed(1)}%;background:${cat?catColorVar(cat):'var(--brand)'}"></span></span>
            <span class="v-share num">${v.share.toFixed(0)}%</span>
            <span class="v-amt num">${fmtSGD(v.total)}</span>
            <span class="v-cnt num">${v.count} ${v.count===1?'line':'lines'}</span>
          </div>`).join('')}
      </div>
    </section>` : '';

  /* ---- labour: who worked, and what the overtime was actually for ---- */
  let crewBlock = '';
  const L = labourOf(pid);
  if(cat==='labour' && L){
    const otMax = Math.max(...L.crew.map(e=>e.ot));
    const totalCost = L.crew.reduce((s,e)=>s+e.normal+e.ot,0) * L.summary.hourly_rate;
    const sorted = L.crew.slice().sort((a,b)=>b.ot-a.ot);
    const inc = incidentsFor(pid).slice().sort((a,b)=>b.ot_hours-a.ot_hours);
    const incMax = Math.max(...inc.map(i=>i.ot_hours));
    crewBlock = `
      <section class="dd-sec">
        <div class="section-label">What the overtime was for <span class="src-tag">SAP B1 records</span></div>
        <div class="inc-list">
          ${inc.map(i=>`<button class="inc-row ${i.kind}${i.kind==='unexplained'?' unexplained':''}" ${i.kind==='unexplained'?'disabled':`data-incident="${i.id}"`}>
            <span class="inc-hrs num">${i.ot_hours}<em>hrs</em></span>
            <span class="inc-body">
              <span class="inc-title">${i.title}</span>
              <span class="inc-doc">${i.doc?`${i.doc} · ${i.ref}`:'no supporting document'}</span>
            </span>
            <span class="inc-track"><span class="inc-fill" style="width:${(i.ot_hours/incMax*100).toFixed(0)}%"></span></span>
            ${i.kind==='unexplained'?'':`<span class="inc-go">${iconChevron()}</span>`}
          </button>`).join('')}
        </div>
        <div class="dd-note">${(()=>{ const u=inc.find(x=>x.kind==='unexplained'); const tot=L.summary.overtime_hours;
          return u ? `${tot-u.ot_hours} of ${tot} overtime hours trace to a document in SAP Business One. The remaining ${u.ot_hours} do not, and are reported as such rather than absorbed.`
                   : `All ${tot} overtime hours trace to a document in SAP Business One.`; })()}</div>
      </section>

      <section class="dd-sec">
        <div class="section-label">Crew — ${L.summary.craftsmen} people, ${L.summary.total_hours.toLocaleString()} hours <span class="src-tag">Time &amp; Attendance</span></div>
        <div class="crew-stats">
          <div><span class="cs-k">Normal</span><span class="cs-v num">${L.summary.normal_hours.toLocaleString()} h</span></div>
          <div><span class="cs-k">Overtime</span><span class="cs-v num warnv">${L.summary.overtime_hours.toLocaleString()} h</span></div>
          <div><span class="cs-k">Rate</span><span class="cs-v num">${fmtSGD(L.summary.hourly_rate)}/h</span></div>
          <div><span class="cs-k">Crew cost</span><span class="cs-v num">${fmtSGD(totalCost)}</span></div>
        </div>
        <div class="txn-scroll">
        <table class="txn-table crew-table" style="min-width:620px">
          <thead><tr>
            <th>Craftsman</th><th>Role</th><th class="ta-r">Normal</th><th class="ta-r">OT</th>
            <th style="width:96px">OT share</th><th class="ta-r">Cost</th>
          </tr></thead>
          <tbody>
            ${sorted.map(e=>`<tr class="${e.ot>=otMax*0.85?'ot-hot':''}">
              <td><b>${e.name}</b><span class="crew-id">${e.id}</span></td>
              <td><span class="role-chip">${e.role}</span></td>
              <td class="ta-r num">${e.normal}</td>
              <td class="ta-r num ${e.ot>=otMax*0.85?'bad':''}">${e.ot}</td>
              <td><span class="ot-track"><span class="ot-fill" style="width:${(e.ot/otMax*100).toFixed(0)}%"></span></span><span class="ot-pc num">${Math.round(e.ot/(e.normal+e.ot)*100)}%</span></td>
              <td class="ta-r num">${fmtSGD((e.normal+e.ot)*L.summary.hourly_rate)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        </div>
        <div class="dd-note">Crew reconciles to the ${fmtSGD(L.summary.labour_cost)} site-crew subset. Full category actual (${fmtSGD(actualOf(pid,'labour'))}) also carries design, procurement, event and dismantling payroll, listed below.</div>
      </section>`;
  }

  const table = `
    <section class="dd-sec">
      <div class="section-label">${cat==='labour'?'Payroll lines':'Transactions'} — ${rows.length}</div>
      <div class="dd-toolbar">
        <div class="toggle ${state.ddFlaggedOnly?'checked':''}" id="flaggedToggle">
          <span class="box">${state.ddFlaggedOnly?iconCheck():''}</span> With a named cause (${flaggedCount})
        </div>
      </div>
      <div class="txn-scroll"><table class="txn-table" style="min-width:740px">
        <thead><tr>
          <th class="${sortCls('id')}" data-sort-key="id">ID${sortArrow('id')}</th>
          <th class="${sortCls('date')}" data-sort-key="date">Date${sortArrow('date')}</th>
          <th>Vendor</th><th>Description</th><th>Phase</th><th>Source</th>
          <th class="${sortCls('amount')} ta-r" data-sort-key="amount">Amount${sortArrow('amount')}</th>
        </tr></thead>
        <tbody>
          ${rows.map(t=>{
            const flagged = isFlagged(t);
            const badge = t.category==='labour'
              ? `<span class="tag-badge" style="color:var(--cat-labour)" title="Computed from Time & Attendance clock records — hours × hourly rate, allocated to this project">Time & Att.</span>`
              : `<span class="tag-badge" style="color:var(--brand)" title="Posted document in SAP Business One (PO / A/P invoice / subcontract)">SAP B1</span>`;
            return `<tr class="${flagged?'flagged':''} ${state.ddHighlightId===t.id?'trace-highlight':''} ${t.driver?'has-driver':''}" ${state.ddHighlightId===t.id?'id="ddHighlightRow"':''} ${t.driver?`data-driver="${t.id}"`:''}>
              <td>${t.id}</td><td>${t.date}</td><td>${t.vendor}</td>
              <td>${t.description}
                ${t.driver?`<span class="cause-chip">${CAUSE_LABEL[t.driver.cause]||t.driver.cause}${t.driver.incident?` · ${t.driver.incident}`:''} ${iconChevron()}</span>`:''}
                ${flagged&&t.quoted_amount?` <span class="over-quote">${t.driver&&t.driver.cause==='estimate_not_quote'?'estimated':'quoted'} ${fmtSGD(t.quoted_amount)} · +${Math.round((t.amount-t.quoted_amount)/t.quoted_amount*100)}%</span>`:''}</td>
              <td class="cap">${t.phase}</td>
              <td>${badge}</td>
              <td class="ta-r num">${fmtSGD(t.amount)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    </section>`;

  document.getElementById('ddBody').innerHTML = summary + driverBlock + crewBlock + vendorBlock + table + `
    <div class="callout info" style="margin-top:4px">${iconInfo()}<div><b>This ledger is read-only.</b> Cost documents come from <b>SAP Business One</b>; labour lines are computed from <b>Time &amp; Attendance</b> clock records (hours × rate) and allocated to the project. A <span style="color:var(--critical);font-weight:600">red row</span> has a stated reason — a named cost driver or a price above its firm quote — and clicking it opens the arithmetic and the B1 documents behind it. Correcting a posting is a change a person makes in B1.</div></div>`;

  const hlRow = document.getElementById('ddHighlightRow');
  if(hlRow) setTimeout(()=>hlRow.scrollIntoView({block:'center', behavior:'smooth'}), 80);
  document.querySelectorAll('.txn-table th.sortable').forEach(el=>el.addEventListener('click', ()=>{
    const key = el.dataset.sortKey;
    if(state.ddSort && state.ddSort.key===key) state.ddSort.dir = state.ddSort.dir==='asc' ? 'desc' : 'asc';
    else state.ddSort = { key, dir: key==='amount' ? 'desc' : 'asc' };
    renderDrilldown();
  }));
  document.querySelectorAll('#ddBody [data-driver]').forEach(el=>el.addEventListener('click', e=>{
    e.stopPropagation(); openDriverDrawer(el.dataset.driver);
  }));
  document.querySelectorAll('#ddBody [data-incident]').forEach(el=>el.addEventListener('click', ()=> openIncidentDrawer(el.dataset.incident)));
}


/* COMMITMENTS DRAWER — the money that is coming but not yet invoiced. */
function openCommitmentsDrawer(pid){
  const rows = openCommitmentsFor(pid);
  const total = rows.length ? rows.reduce((s,r)=>s+r.amount,0) : openCommitment(pid);
  const KIND_LBL = { open_po:'Open PO', booking:'Booking', crew_roster:'Crew roster' };
  state.alertOpen = 'commit:'+pid;
  const dr = document.getElementById('alertDrawer');
  dr.innerHTML = `
    <div class="ad-head">
      <button class="icon-btn" id="adClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      <span class="a-sev" style="color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn)">Committed</span>
      <span class="ad-id">${pid}</span>
    </div>
    <div class="ad-body">
      <h2 class="ad-title">Committed, not yet billed</h2>
      <div class="ad-impact"><span class="adi-v num">${fmtSGD(total)}</span><span class="adi-k">will land on cost — no invoice posted yet</span></div>
      <section class="ad-sec">
        <div class="section-label">What sits in this bucket</div>
        <p class="ad-p">Money the project is already contractually holding: purchase orders placed but not yet received or invoiced, bookings signed for later phases, and crew rosters approved in Time &amp; Attendance but not yet worked. None of it is in actuals; all of it is coming — the forecast counts it as spent, because avoiding it would mean cancelling orders.</p>
      </section>
      ${rows.length?`<section class="ad-sec">
        <div class="section-label">The ${rows.length} commitments</div>
        <div class="doc-list">
        ${rows.map(r=>`<div class="doc-row">
          <span class="doc-type">${KIND_LBL[r.kind]||r.kind}</span>
          <span class="doc-ref">${r.doc_ref}</span>
          <span class="doc-note"><b>${r.vendor}</b> — ${r.description}<br/><span class="mono" style="font-size:9px;letter-spacing:.05em;color:var(--text-faint)"><span class="cat-tick" style="background:${catColorVar(r.category)};width:6px;height:6px;display:inline-block;margin-right:4px"></span>${catLabel(r.category).toUpperCase()} · DUE ${r.due_date} · <b class="num" style="color:var(--text)">${fmtSGD(r.amount)}</b></span></span>
        </div>`).join('')}
        </div>
        <p class="ad-fine">Each line is allocated to its own category in the forecast column — no pro-rata spreading. Read-only references; the documents live in SAP Business One and the T&amp;A roster.</p>
      </section>`:`<section class="ad-sec"><p class="ad-p">No itemised commitments on file for this project — the figure is derived from the forecast model (forecast final cost − actuals to date).</p></section>`}
    </div>`;
  document.getElementById('alertScrim').classList.add('open');
  dr.classList.add('open');
  document.getElementById('adClose').addEventListener('click', closeAlertDrawer);
}

/* =========================================================================
   COST DRIVER DRAWER — "we paid more; here is exactly what for."
   Names the cause, shows the arithmetic, and lists the SAP Business One
   documents a controller can open to check it. Read-only throughout.
   ========================================================================= */
function openDriverDrawer(txnId){
  const t = txnById(txnId); if(!t || !t.driver) return;
  const d = t.driver;
  const inc = d.incident ? incidentById(d.incident) : null;
  const docs = d.docs || (inc ? inc.docs : []);
  const overQuote = t.quoted_amount ? t.amount - t.quoted_amount : null;
  state.alertOpen = 'driver:'+txnId;
  const dr = document.getElementById('alertDrawer');

  dr.innerHTML = `
    <div class="ad-head">
      <button class="icon-btn" id="adClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      <span class="a-sev" style="color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn)">${CAUSE_LABEL[d.cause]||d.cause}</span>
      <span class="ad-id">${t.id}</span>
    </div>
    <div class="ad-body">
      <h2 class="ad-title">${t.description}</h2>
      <div class="ad-vendor"><span class="cat-tick" style="background:${catColorVar(t.category)}"></span>${t.vendor} · ${catLabel(t.category)} · ${t.phase}</div>

      <div class="ad-impact ${overQuote?'neg':''}">
        <span class="adi-v num">${fmtSGD(t.amount)}</span>
        <span class="adi-k">${overQuote ? `${fmtSGD(overQuote)} above the S${'$'}${t.quoted_amount.toLocaleString()} ${d.cause==='estimate_not_quote'?'budgetary estimate':'quoted'}` : 'posted amount'}</span>
      </div>

      ${overQuote ? `<section class="ad-sec">
        <div class="section-label">Computed</div>
        <div class="synth-computed"><code>${fmtSGD(t.amount)} − ${fmtSGD(t.quoted_amount)} = +${fmtSGD(overQuote)} (+${Math.round(overQuote/t.quoted_amount*100)}%)</code></div>
      </section>` : ''}

      <section class="ad-sec">
        <div class="section-label">${aiMark()} Why it cost more</div>
        <p class="ad-p">${d.note}</p>
        ${inc ? `<p class="ad-p">Linked to <b>${inc.id}</b> — ${inc.title.toLowerCase()}. ${inc.detail}</p>` : ''}
      </section>

      ${docs.length ? `<section class="ad-sec">
        <div class="section-label">Records in SAP Business One</div>
        <div class="doc-list">
          ${docs.map(x=>`<div class="doc-row">
            <span class="doc-type">${x.type}</span>
            <span class="doc-ref">${x.ref}</span>
            <span class="doc-note">${x.note||''}</span>
          </div>`).join('')}
        </div>
        <p class="ad-fine">Read-only references. Open them in SAP Business One to verify — this workspace cannot alter them.</p>
      </section>` : ''}

      ${inc && inc.ot_hours ? `<section class="ad-sec">
        <div class="section-label">Overtime it caused</div>
        <div class="ad-otsum">
          <span class="adi-v num">${inc.ot_hours}</span>
          <span class="adi-k">hours · ${Object.entries(inc.ot_by_phase).map(([p,h])=>`${h}h ${p}`).join(' · ')}</span>
        </div>
      </section>` : ''}

      <section class="ad-sec">
        <div class="ad-actions">
          ${inc?`<button class="btn ghost sm" data-open-incident="${inc.id}">${iconAlert()} Open the incident</button>`:''}
        </div>
      </section>
    </div>`;
  document.getElementById('alertScrim').classList.add('open');
  dr.classList.add('open');
  document.getElementById('adClose').addEventListener('click', closeAlertDrawer);
  dr.querySelectorAll('[data-open-incident]').forEach(el=>el.addEventListener('click', ()=> openIncidentDrawer(el.dataset.openIncident)));
}

/* ---------- Incident drawer: one recorded event, and everything it cost ---------- */
function openIncidentDrawer(id){
  const i = incidentById(id); if(!i) return;
  state.alertOpen = 'incident:'+id;
  const dr = document.getElementById('alertDrawer');
  const L = labourOf(i.project_id);
  const otCost = L ? i.ot_hours * L.summary.hourly_rate : null;
  const txns = (i.txnIds||[]).map(txnById).filter(Boolean);

  dr.innerHTML = `
    <div class="ad-head">
      <button class="icon-btn" id="adClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      <span class="a-sev" style="color:var(--warn-ink);background:var(--warn-bg);border-color:var(--warn)">Incident</span>
      <span class="ad-id">${i.id}${i.date?` · ${i.date}`:''}</span>
    </div>
    <div class="ad-body">
      <h2 class="ad-title">${i.title}</h2>
      ${i.doc?`<div class="ad-vendor"><b>${i.doc}</b> · ${i.ref}</div>`:''}

      <div class="ad-impact neg">
        <span class="adi-v num">${i.ot_hours}</span>
        <span class="adi-k">overtime hours${otCost?` · ${fmtSGD(otCost)} at ${fmtSGD(L.summary.hourly_rate)}/h`:''}</span>
      </div>

      <section class="ad-sec">
        <div class="section-label">${aiMark()} What happened</div>
        <p class="ad-p">${i.detail}</p>
      </section>

      <section class="ad-sec">
        <div class="section-label">Hours by phase</div>
        ${(()=>{ const m=Math.max(...Object.values(i.ot_by_phase),1);
          return Object.entries(i.ot_by_phase).map(([p,h])=>`<div class="ot-phase-row">
            <span class="cap">${p}</span>
            <div class="optrack"><span style="width:${(h/m*100).toFixed(0)}%"></span></div>
            <span class="num" style="text-align:right">${h} hrs</span></div>`).join(''); })()}
      </section>

      ${i.docs && i.docs.length ? `<section class="ad-sec">
        <div class="section-label">Records in SAP Business One</div>
        <div class="doc-list">
          ${i.docs.map(x=>`<div class="doc-row"><span class="doc-type">${x.type}</span><span class="doc-ref">${x.ref}</span><span class="doc-note">${x.note||''}</span></div>`).join('')}
        </div>
      </section>` : `<section class="ad-sec">
        <div class="callout warn">${iconAlert()}<div>No document in SAP Business One accounts for these hours. They are reported as unexplained rather than folded into another cause.</div></div>
      </section>`}

      ${txns.length ? `<section class="ad-sec">
        <div class="section-label">Cost lines it touched</div>
        ${txns.map(t=>`<button class="ad-ev" data-driver="${t.id}">
          <span class="ade-id">${t.id}</span>
          <span class="ade-body"><b>${t.vendor}</b><em>${t.description}</em></span>
          <span class="ade-amt num">${fmtSGD(t.amount)}</span>
        </button>`).join('')}
      </section>` : ''}
    </div>`;
  document.getElementById('alertScrim').classList.add('open');
  dr.classList.add('open');
  document.getElementById('adClose').addEventListener('click', closeAlertDrawer);
  dr.querySelectorAll('[data-driver]').forEach(el=>el.addEventListener('click', ()=> openDriverDrawer(el.dataset.driver)));
}

   ========================================================================= */
function renderAiPanel(){
  document.getElementById('aiScope').textContent = 'Scope · ' + (
    state.screen==='A' ? `Portfolio · ${PROJECTS.length} projects` :
    state.screen==='D' ? 'Gardens by the Bay CNY 2027 (quote draft)' :
    state.screen==='S' ? 'Workspace settings' :
    project(state.selectedProject).name);
  document.getElementById('aiNameMark').innerHTML = iconCompass('currentColor');

function renderActivityTab(){
  const body = document.getElementById('activityFeed');
  if(!body) return;
  if(!ACTIVITY_LOG.length){
    body.innerHTML = `<div class="empty-note">Nothing yet. Confirming an attribution, acknowledging an issue or approving a quote is recorded here — a running account of what this workspace has done, and what a person told it to do.</div>`;
    return;
  }
  body.innerHTML = ACTIVITY_LOG.map(a=>`<div class="activity-item"><span class="act-icon">${a.icon}</span><div><div class="act-text">${a.text}</div><div class="act-time">${timeAgo(a.ts)}</div></div></div>`).join('');
}

/* ---------- Alert drawer: the long-form explanation behind one alert ---------- */
function openAlertDrawer(id){
  const r = RISK_ALERTS.find(a=>a.id===id);
  if(!r) return;
  state.alertOpen = id;
  const dr = document.getElementById('alertDrawer');
  const sev = r.severity;
  const ev = (r.evidenceIds||[]).map(i=>txnById(i)).filter(Boolean);
  const evTotal = ev.reduce((s,t)=>s+t.amount,0);

  const crew = r.crewEvidence ? (()=>{
    const top = LABOUR_ENTRIES.slice().sort((a,b)=>b.ot-a.ot).slice(0,4);
    const otMax = top[0].ot;
    return `<section class="ad-sec">
      <div class="section-label">Highest overtime <span class="src-tag">Time &amp; Attendance</span></div>
      ${top.map(e=>`<div class="ad-crew">
        <span class="adc-name">${e.name}<em>${e.role}</em></span>
        <span class="ot-track"><span class="ot-fill" style="width:${(e.ot/otMax*100).toFixed(0)}%"></span></span>
        <span class="adc-ot num">${e.ot} h OT</span>
      </div>`).join('')}
    </section>`;
  })() : '';

  const evidence = ev.length ? `<section class="ad-sec">
      <div class="section-label">Evidence — ${ev.length} lines, ${fmtSGD(evTotal)}</div>
      ${ev.map(t=>`<button class="ad-ev" data-trace-txn="${t.id}" data-trace-cat="${t.category}">
        <span class="ade-id">${t.id}</span>
        <span class="ade-body"><b>${t.vendor}</b><em>${t.description}</em></span>
        <span class="ade-amt num">${fmtSGD(t.amount)}</span>
      </button>`).join('')}
    </section>` : '';

  dr.innerHTML = `
    <div class="ad-head sev-${sev}">
      <button class="icon-btn" id="adClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button>
      <span class="a-sev">${sev} severity</span>
      <span class="ad-id">${r.id}</span>
    </div>
    <div class="ad-body">
      <h2 class="ad-title">${r.what_happened}</h2>
      <div class="ad-impact ${r.expected_impact_sgd!=null?'neg':''}">

/* ---------------------------------------------------------------------------
   Cross-project answers. The whole reason the Ask panel is permanent is that a
   question can reach past whatever screen you happen to be on — "which job ever
   made the best margin" is answered from the same snapshots the sheets use.
   --------------------------------------------------------------------------- */
function rankByMargin(){
  return PROJECTS.filter(p=>SNAPSHOTS[p.id]).map(p=>{
    const s = SNAPSHOTS[p.id];
    return { p, s, final:!!s.final, margin:s.margin_pct, vsPlan:+(s.margin_pct - s.budget_margin_pct).toFixed(1) };
  }).sort((a,b)=>b.margin-a.margin);
}
function bestWorstAnswer(kind){
  const done = rankByMargin().filter(r=>r.final);
  const row = kind==='best' ? done[0] : done[done.length-1];
  const other = kind==='best' ? done[done.length-1] : done[0];
  const d = buildDiagnosis(row.p.id);
  return {
    text:`<b>${row.p.name}</b> — ${pct(row.margin)} final, the ${kind} of the ${done.length} delivered jobs (${other.p.name} came in at ${pct(other.margin)}). Against its own ${pct(row.s.budget_margin_pct)} plan it landed ${row.vsPlan>0?'+':''}${row.vsPlan} points. ${d.worst?`${d.worst.label} was the largest single leak at ${fmtSGD(d.worst.impact)}.`:''}`,
    open: row.p.id };
}
function pushProjectAnswer(pid, text){
  state.chatLog.push({ role:'ai', text, openProject:pid });
}


/* ---- real AI backend (Claude tool-use over the workspace DB) ----
   Falls back to the local scripted engine if the API is unreachable. */
function chatContextPid(){ return state.screen==='B' ? state.selectedProject : null; }
async function askBackend(questionText, opts={}){
  if(state.chatBusy) return;
  state.chatBusy = true;
  state.chatLog.push({ role:'user', text: questionText });
  state.chatLog.push({ role:'typing' });
  renderChatTab();
  let res = null;
  try{
    const r = await fetch('api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ question: questionText, project_id: chatContextPid(),
        history: state.chatLog.filter(t=>t.role==='user'||t.role==='ai').slice(0,-2).slice(-10)
                  .map(t=>({role:t.role, text:t.text})) }) });
    if(r.ok) res = await r.json();
  }catch(e){ /* offline / backend down -> scripted fallback below */ }
  const ti = state.chatLog.findIndex(t=>t.role==='typing');
  if(ti>=0) state.chatLog.splice(ti,1);
  state.chatBusy = false;
  if(res && res.text){
    const turn = { role:'ai', text: res.text };
    if(res.chips && res.chips.length) turn.chips = res.chips;
    if(res.open_project) turn.openProject = res.open_project;
    state.chatLog.push(turn);
    if(opts.after) opts.after(res);
    renderChatTab();
  } else {
    answerTyped(questionText);
    renderChatTab();
  }
}

function runSuggestedChat(key){
  if(key==='portfolio-risk') askBackend('Which project is most at risk?');
  else if(key==='best-ever') askBackend('Which project made the best margin?');
  else if(key==='plan-match') askBackend('Which project landed closest to its planned margin, and which missed its plan by the most?');
  else if(key==='prj1-profit') askBackend('How profitable is the Orchard Road Christmas project?', { after:()=>{ state.chatFollowupReady = true; renderChatTab(); } });
  else if(key==='this-project') askBackend('How did ' + project(state.selectedProject).name + ' do?');
  else if(key==='forecast-why') askBackend('What is the forecast final margin for ' + project(state.selectedProject).name + ', and what is driving it?');
  else if(key==='follow-why'){ state.chatFollowupReady = false; askBackend('Why is the forecast margin lower than target?'); }
  else if(key==='quote-ref-labour') askBackend('Compare what labour actually cost on Orchard Road Christmas 2025 and Gardens by the Bay Festive 2025, and why it overran on both.');
  else if(key==='quote-why-cont') askBackend('Why does the CNY 2027 quote carry labour and subcontractor contingencies, and how large are they?');
}

/* The typed-question router. Anything it cannot ground in the data is declined. */
function answerTyped(text){
  const t = text.toLowerCase();
  const pid = state.screen==='B' ? state.selectedProject : 'PRJ-001';

  if(/\b(best|highest|most profitable|top)\b/.test(t) && /margin|profit|project|job/.test(t)){
    const a = bestWorstAnswer('best'); pushProjectAnswer(a.open, a.text); return;
  }
  if(/\b(worst|lowest|least profitable)\b/.test(t)){
    const a = bestWorstAnswer('worst'); pushProjectAnswer(a.open, a.text); return;
  }
  if(/compare|versus| vs |all project|every project|portfolio/.test(t)){
    const rows = rankByMargin();
    state.chatLog.push({ role:'ai', text:`Ranked by margin:<br/>` + rows.map(r=>
      `<b>${pct(r.margin)}</b> — ${r.p.name} (${r.final?'final':'in progress'}, ${r.vsPlan>0?'+':''}${r.vsPlan} vs plan)`).join('<br/>') });
    return;
  }
  if(/\brisk|at risk|worried|attention\b/.test(t)){
    state.chatLog.push(CHAT_SEQUENCE_PORTFOLIO[1]); return;
  }
  if(/overtime|\bot\b|hours|crew|craftsm|who worked/.test(t)){
    state.chatLog.push({ role:'ai', text:`${LABOUR_SUMMARY.overtime_hours} overtime hours across ${LABOUR_SUMMARY.craftsmen} craftsmen on Orchard Road Christmas 2026, ${OT_BY_PHASE.installation} of them in Installation. The two riggers carry the most — Ng Jia Hao at 88 h and Suresh Pillai at 84 h.`,
      chips:[{ label:'Open crew detail', cat:'labour' }] }); return;
  }
  const cat = CATS.find(c=>t.includes(c));
  if(cat){
    const ins = insightsFor(pid).find(i=>i.category===cat);
    state.chatLog.push({ role:'ai', text:`On ${project(pid).name}: ${ins.headline} That is ${ins.deltaPct>0?'+':''}${ins.deltaPct}% against plan, ${fmtSGD(Math.abs(ins.impact_sgd))} ${ins.impact_sgd>=0?'gained':'lost'} on margin.`,
      chips: [{ label:`Open ${catLabel(cat)} detail`, cat }] });
    return;
  }
  const named = PROJECTS.find(p=>t.includes(p.name.toLowerCase().split(' ')[0]) && t.includes(p.name.toLowerCase().split(' ').pop()));
  if(named && SNAPSHOTS[named.id]){
    const s2 = SNAPSHOTS[named.id];
    pushProjectAnswer(named.id, `<b>${named.name}</b> — revenue ${fmtSGD(s2.revenue)}, cost ${fmtSGD(s2.actual_cost)}, margin ${pct(s2.margin_pct)} against a ${pct(s2.budget_margin_pct)} plan.`);
    return;
  }
  if(/profit|margin|how much|how did|doing/.test(t)){
    const snap = SNAPSHOTS[pid], d = buildDiagnosis(pid);
    state.chatLog.push({ role:'ai', text:`${project(pid).name}: revenue ${fmtSGD(snap.revenue)}, cost ${fmtSGD(snap.actual_cost)}, margin ${pct(snap.margin_pct)} against ${pct(snap.budget_margin_pct)} planned. ${d.verdict}` });
    if(pid==='PRJ-001') state.chatFollowupReady = true;
    return;
  }
  state.chatLog.push({ role:'ai', text:`I can't ground that one in the data I have, so I won't guess. Try: which project made the best margin, how a project is doing, a single category, or overtime and crew hours.` });
}
